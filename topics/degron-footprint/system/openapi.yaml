            - JOB_NOT_FOUND
            - DATASET_NOT_FOUND
            - CONFIRMATION_REQUIRED
            - IMPORT_INVALID
            - DATASET_NOT_COMMITTED
            - INCOMPATIBLE_ENDPOINT
            - JOB_STATE_CONFLICT
            - SNAPSHOT_UNAVAILABLE
        message: {type: string}
