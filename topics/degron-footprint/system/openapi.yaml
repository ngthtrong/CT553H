components:
  headers:
    RequestId:
      description: Opaque id for support. Never derived from the input.
      schema: {type: string}
  parameters:
    UniprotId:
      name: uniprot_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UniprotId'}
    TileIndex:
      name: tile_index
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ShareToken:
      name: X-Share-Token
      in: header
      required: true
      description: Plain share token returned by `POST /v1/runs`.
      schema: {type: string, minLength: 22, maxLength: 64}
  responses:
    Error:
      description: Error. The `code` is stable; the `message` is for humans.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            length:
              summary: Sequence of the wrong length
              value:
                code: INVALID_LENGTH
                message: 'The sequence must have exactly 28 amino acids; it has 27.'
                field: sequence
            outOfDomain:
              summary: Stable tile
              value:
                code: OUT_OF_DOMAIN
                message: 'The measured wild-type PSI of this tile (4.8) is above the 4.0 limit of the training domain. Set override_domain to true to score it anyway.'
                field: null
  schemas:
    UniprotId:
      type: string
      pattern: '^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$'
      examples: [P60484, A6NMZ7]
    AminoAcid:
      type: string
      pattern: '^[ACDEFGHIKLMNPQRSTVWY]$'
    TileSequence:
      type: string
      pattern: '^[ACDEFGHIKLMNPQRSTVWY]{28}$'
      description: Exactly 28 standard amino acids, upper case.
    ExportFormat:
      type: string
      enum: [csv, json]
    DomainStatus:
      type: string
      enum:
        - measured_in_domain
        - measured_out_of_domain
        - measured_unreliable
        - predicted_in_domain
        - predicted_out_of_domain
        - borderline  # planned R3 integration; not returned by the baseline
        - unknown
    RequestTarget:
      description: |
        Exactly one of `sequence` or the pair `uniprot_id` + `tile_index`. This schema only states that rule;
        the property lists are in `PredictRequest`, `ExportRequest` and `RunRequest`, each of which is closed
        (`additionalProperties: false`) so that an unknown field is a 422.
      oneOf:
        - required: [sequence]
          not: {anyOf: [{required: [uniprot_id]}, {required: [tile_index]}]}
        - required: [uniprot_id, tile_index]
          not: {required: [sequence]}
    RequestSequence:
      type: string
      maxLength: 64
      description: |
        The server upper-cases and trims it, then requires `TileSequence`. The loose
        `maxLength` only exists so that an over-long input gets `INVALID_LENGTH` rather than
        a schema error.
    RequestTileIndex:
      type: integer
      minimum: 1
    RequestModelId:
      type: string
      description: Defaults to the frozen default model.
    RequestCalibrator:
      type: string
      enum: [platt, iso]
      description: Defaults to the one stored with the model.
    RequestOverrideDomain:
      type: boolean
      default: false
      description: Score a tile that is measured to be outside the training domain. The result then carries the warning `OUT_OF_DOMAIN_OVERRIDDEN`.
    PredictRequest:
      type: object
      description: Exactly one of `sequence` or the pair `uniprot_id` + `tile_index`.
      additionalProperties: false
      properties:
        sequence: {$ref: '#/components/schemas/RequestSequence'}
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        tile_index: {$ref: '#/components/schemas/RequestTileIndex'}
        model_id: {$ref: '#/components/schemas/RequestModelId'}
        calibrator: {$ref: '#/components/schemas/RequestCalibrator'}
        override_domain: {$ref: '#/components/schemas/RequestOverrideDomain'}
      allOf:
        - $ref: '#/components/schemas/RequestTarget'
    ExportRequest:
      type: object
      description: A `PredictRequest` plus the file format. Written out in full because a closed schema cannot be extended with `allOf`.
      additionalProperties: false
      required: [format]
      properties:
        sequence: {$ref: '#/components/schemas/RequestSequence'}
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        tile_index: {$ref: '#/components/schemas/RequestTileIndex'}
        model_id: {$ref: '#/components/schemas/RequestModelId'}
        calibrator: {$ref: '#/components/schemas/RequestCalibrator'}
        override_domain: {$ref: '#/components/schemas/RequestOverrideDomain'}
        format: {$ref: '#/components/schemas/ExportFormat'}
      allOf:
        - $ref: '#/components/schemas/RequestTarget'
    RunRequest:
      type: object
      description: A `PredictRequest` plus the lifetime of the share link. Written out in full for the same reason as `ExportRequest`.
      additionalProperties: false
      properties:
        sequence: {$ref: '#/components/schemas/RequestSequence'}
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        tile_index: {$ref: '#/components/schemas/RequestTileIndex'}
        model_id: {$ref: '#/components/schemas/RequestModelId'}
        calibrator: {$ref: '#/components/schemas/RequestCalibrator'}
        override_domain: {$ref: '#/components/schemas/RequestOverrideDomain'}
        ttl_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
      allOf:
        - $ref: '#/components/schemas/RequestTarget'
    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - DOMAIN_UNKNOWN
            - DOMAIN_UNRELIABLE
            - OUT_OF_DOMAIN_OVERRIDDEN
            - PREDICTED_DOMAIN
            - TRAINING_PEPTIDE
        message: {type: string}
    Cell:
      type: object
      required: [position, wt_aa, mut_aa, score_dpsi_raw, p_dpsi_ge_1_calibrated, rank_in_tile, top10pct_in_tile]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 28
          description: 1-based within the tile.
        wt_aa: {$ref: '#/components/schemas/AminoAcid'}
        mut_aa: {$ref: '#/components/schemas/AminoAcid'}
        score_dpsi_raw:
          type: number
          description: Raw regression output of the ridge model. Not a probability and not clipped.
        p_dpsi_ge_1_calibrated:
          type: number
          minimum: 0
          maximum: 1
          description: Calibrated probability of the event `DeltaPSI >= 1.0` for this assay and domain.
        rank_in_tile:
          type: integer
          minimum: 1
          maximum: 532
          description: 1 is the highest raw score within the tile.
        top10pct_in_tile:
          type: boolean
    DataSourceRef:
      type: object
      required: [source_id, name, version, license_name, attribution_text]
      properties:
        source_id: {type: string}
        name: {type: string}
        version: {type: string}
        license_name: {type: string}
        attribution_text: {type: string}
    Provenance:
      type: object
      description: Present in every 200 response that carries scores or overlays and written into every export.
      required: [model_id, weights_sha256, event_definition, evidence_label, domain_description, data_sources, code_version, generated_at, disclaimers]
      properties:
        model_id: {type: string}
        model_kind: {type: string}
        weights_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        feature_spec: {type: string}
        event_definition: {type: string, examples: ['P(DeltaPSI >= 1.0)']}
        evidence_label: {type: string}
        domain_description: {type: string}
        data_sources:
          type: array
          items: {$ref: '#/components/schemas/DataSourceRef'}
        code_version: {type: string}
        generated_at: {type: string, format: date-time}
        disclaimers:
          type: array
          minItems: 1
          items: {type: string}
    TileInfo:
      type: object
      required: [sequence]
      properties:
        uniprot_id: {oneOf: [{$ref: '#/components/schemas/UniprotId'}, {type: 'null'}]}
        tile_index: {type: [integer, 'null']}
        start_pos: {type: [integer, 'null']}
        end_pos: {type: [integer, 'null']}
        sequence: {$ref: '#/components/schemas/TileSequence'}
    DomainInfo:
      type: object
      required: [status, message]
      properties:
        status: {$ref: '#/components/schemas/DomainStatus'}
        psi_wt_measured: {type: [number, 'null']}
        reads_measured: {type: [number, 'null']}
        gate_model_id: {type: [string, 'null']}
        gate_weights_sha256: {type: [string, 'null'], description: Planned v0.2 frozen gate provenance.}
        measurement_estimator: {type: [string, 'null'], description: Planned v0.2 distinction between screen and intrinsic estimators.}
        message: {type: string}
    PredictionResult:
      type: object
      required: [provenance, tile, domain, warnings, cells]
      properties:
        provenance: {$ref: '#/components/schemas/Provenance'}
        tile: {$ref: '#/components/schemas/TileInfo'}
        domain: {$ref: '#/components/schemas/DomainInfo'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
        cells:
          type: array
          minItems: 532
          maxItems: 532
          items: {$ref: '#/components/schemas/Cell'}
    ProteinSummary:
      type: object
      required: [uniprot_id, length, n_tiles]
      properties:
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        gene_symbol: {type: [string, 'null']}
        protein_name: {type: [string, 'null']}
        length: {type: integer}
        n_tiles: {type: integer}
    TileSummary:
      type: object
      required: [tile_index, start_pos, end_pos, sequence, scorable, domain_status]
      properties:
        tile_index: {type: integer, minimum: 1}
        start_pos: {type: integer}
        end_pos: {type: integer}
        sequence: {type: string, minLength: 28, maxLength: 28}
        scorable: {type: boolean}
        domain_status: {$ref: '#/components/schemas/DomainStatus'}
        psi_wt_measured: {type: [number, 'null']}
        reads_measured: {type: [number, 'null']}
    TileList:
      type: object
      required: [protein, tiles, provenance]
      properties:
        protein: {$ref: '#/components/schemas/ProteinSummary'}
        tiles:
          type: array
          items: {$ref: '#/components/schemas/TileSummary'}
        provenance:
          $ref: '#/components/schemas/Provenance'
    MeasuredCell:
      type: object
      required: [position, mut_aa, delta_psi, in_training_set]
      properties:
        position: {type: integer, minimum: 1, maximum: 28}
        mut_aa: {$ref: '#/components/schemas/AminoAcid'}
        delta_psi: {type: number}
        in_training_set: {type: boolean}
    MeasuredOverlay:
      type: object
      required: [tile, cells, provenance]
      properties:
        tile: {$ref: '#/components/schemas/TileInfo'}
        cells:
          type: array
          items: {$ref: '#/components/schemas/MeasuredCell'}
        provenance:
          $ref: '#/components/schemas/Provenance'
    ClinvarVariant:
      type: object
      required: [variation_id, protein_pos, position, ref_aa, alt_aa, clinsig]
      properties:
        variation_id: {type: integer}
        protein_pos: {type: integer}
        position: {type: integer, minimum: 1, maximum: 28, description: Position inside the tile.}
        ref_aa: {$ref: '#/components/schemas/AminoAcid'}
        alt_aa: {$ref: '#/components/schemas/AminoAcid'}
        clinsig:
          type: string
          enum: [pathogenic, likely_pathogenic, vus, likely_benign, benign, conflicting, other]
        review_status: {type: [string, 'null']}
        last_evaluated: {type: [string, 'null'], format: date}
    ClinvarOverlay:
      description: Baseline payload; optional annotation_status is a planned v0.2 addition.
      type: object
      required: [tile, variants, clinvar_file_date, provenance]
      properties:
        annotation_status: {$ref: '#/components/schemas/AnnotationState'}
        tile: {$ref: '#/components/schemas/TileInfo'}
        variants:
          type: array
          items: {$ref: '#/components/schemas/ClinvarVariant'}
        clinvar_file_date: {type: string, format: date}
        provenance:
          $ref: '#/components/schemas/Provenance'
    ModelSummary:
      type: object
      required: [model_id, role, status, is_default]
      properties:
        model_id: {type: string}
        role: {type: string, enum: [effect, gate]}
        kind: {type: string}
        status: {type: string, enum: [candidate, frozen, retired]}
        is_default: {type: boolean}
    ModelCard:
      allOf:
        - $ref: '#/components/schemas/ModelSummary'
        - type: object
          required: [weights_sha256, event_definition, domain_description, evidence_label, metrics, trained_on_sources, card_markdown, not_used_sources]
          properties:
            weights_sha256: {type: string}
            event_definition: {type: string}
            domain_description: {type: string}
            evidence_label: {type: string}
            metrics:
              type: object
              additionalProperties: true
              description: Copied from the experiment results file named in `metrics_source_file`.
            metrics_source_file: {type: string}
            calibration:
              type:
                - object
                - 'null'
              additionalProperties: true
            trained_on_sources:
              type: array
              items: {$ref: '#/components/schemas/DataSourceRef'}
            card_markdown: {type: string}
            not_used_sources:
              type: array
              description: |
                Sources that were examined and are deliberately not served and not used to train this model
                (licence, scale or coverage reasons). Clients show this list on the model card (ui-design §3.5).
              items: {$ref: '#/components/schemas/NotUsedSource'}
            frozen_at: {type: [string, 'null'], format: date-time}
    NotUsedSource:
      type: object
      required: [source_id, name, reason]
      properties:
        source_id: {type: string}
        name: {type: string}
        reason: {type: string}
    DataSource:
      type: object
      required: [source_id, name, version, citation, license_name, attribution_text]
      properties:
        source_id: {type: string}
        name: {type: string}
        version: {type: string}
        citation: {type: string}
        url: {type: [string, 'null']}
        license_name: {type: string}
        attribution_text: {type: string}
        disclaimer_text: {type: [string, 'null']}
    RunCreated:
      type: object
      required: [run_id, share_token, expires_at, result]
      properties:
        run_id: {type: string, format: uuid}
        share_token:
          type: string
          description: Shown once. Put it in the URL fragment.
        expires_at: {type: string, format: date-time}
        result:
          $ref: '#/components/schemas/PredictionResult'
    Health:
      type: object
      required: [status, version, model_loaded, database]
