          enum:
            - INVALID_REQUEST
            - INVALID_LENGTH
            - INVALID_CHARACTER
            - INVALID_FORMAT
            - UNKNOWN_ACCESSION
            - TILE_OUT_OF_RANGE
            - TILE_NOT_SCORABLE
            - OUT_OF_DOMAIN
            - MODEL_NOT_FOUND
            - RUN_NOT_FOUND
            - RUN_EXPIRED
            - TOKEN_REQUIRED
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
