# One command starts everything:   docker compose up -d --build        (then: make etl-docker once)
# NOT RUN on the machine where this file was written (Docker is not installed there); see backend/README.md §Docker.
name: degron-footprint

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: degron
      POSTGRES_USER: degron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degron -d degron"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build: {context: ../, dockerfile: app/backend/Dockerfile}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DF_DATABASE_URL: postgresql+psycopg://degron:${POSTGRES_PASSWORD}@db:5432/degron
      DF_ALLOWED_ORIGINS: ${DF_ALLOWED_ORIGINS:-["http://localhost:8080"]}
      DF_RATE_LIMIT_PREDICT: ${DF_RATE_LIMIT_PREDICT:-60}
      DF_RATE_LIMIT_REFERENCE: ${DF_RATE_LIMIT_REFERENCE:-120}
      DF_TRUST_PROXY: ${DF_TRUST_PROXY:-false}        # true behind Caddy/nginx so the limiter sees the real client
    volumes: [models:/srv/system/app/backend/models]
    networks: [internal]
    expose: ["8000"]

  # ETL: reads the research data (read-only) and fills the database and the model directory. Run on demand:
  #   docker compose --profile tools run --rm etl            (add: --clinvar-scope degron-only for a small database)
  etl:
    profiles: ["tools"]
    build: {context: ../, dockerfile: app/backend/Dockerfile}
    depends_on:
      db: {condition: service_healthy}
    environment:
      DF_DATABASE_URL: postgresql+psycopg://degron:${POSTGRES_PASSWORD}@db:5432/degron
    # TOPIC_DIR is the checkout's topics/degron-footprint; the ETL never writes there
    volumes:
      - ${TOPIC_DIR:-../..}:/topic:ro
      - models:/srv/system/app/backend/models
    working_dir: /srv/system/app
    command: ["sh", "-c", "(cd backend && alembic -c alembic.ini upgrade head) && python -m etl.load --db $${DF_DATABASE_URL} --topic /topic --clinvar-scope $${CLINVAR_SCOPE:-in-tiles}"]
    networks: [internal]

  # Static frontend (Vite build served by nginx) that proxies /v1 and /healthz to `api`. Written by the frontend task.
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:80"]
    networks: [internal]

  # VPS only: automatic TLS in front of `web`.   docker compose --profile vps up -d
  caddy:
    profiles: ["vps"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment: {SITE_ADDRESS: "${SITE_ADDRESS:?set SITE_ADDRESS to the domain name}"}
    command: ["sh", "-c", "printf '%s {\\n  reverse_proxy web:80\\n}\\n' \"$$SITE_ADDRESS\" > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile"]
    volumes: [caddydata:/data]
    networks: [internal]

volumes:
  dbdata:
  models:
  caddydata:

networks:
  internal:
