# Web container: serves the built interface and proxies the API (docker compose service names: web -> api:8000).
# The browser talks to this one origin only, so the API needs no CORS in the container setup.

# Request logs hold no query string and no client address: $uri has no arguments, so a gene search or a
# share link in the address never reaches the log (api-spec §9, NFR-09).
log_format df '[$time_local] "$request_method $uri" $status $request_time $sent_http_x_request_id';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log df;
    server_tokens off;

    # A prediction request is a few hundred bytes; the API itself refuses more than 4 KiB.
    client_max_body_size 8k;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Security headers (test-plan SEC-03). The CSP string equals csp.ts; tests/security-headers.test.ts checks it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the share token header through; never cache a prediction.
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
        # Re-add the security headers: add_header in a location resets the inherited ones.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /healthz {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
    }

    # Hashed assets can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page application: every other path serves index.html (client-side routes).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
