line-length = 135
target-version = "py311"
extend-exclude = ["backend/migrations/versions", ".venv"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007", "E402", "E741"]

[lint.isort]
known-first-party = ["api", "db", "degron_footprint", "etl", "tests"]
split-on-trailing-comma = false
