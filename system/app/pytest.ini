[pytest]
testpaths = tests
pythonpath = backend .
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
markers =
    slow: needs the real data directory or takes more than a few seconds
    realdata: runs against the real data (skipped when absent)
