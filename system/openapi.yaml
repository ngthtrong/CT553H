          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Paginated immutable history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - workspace
      operationId: compareDataset
      summary: Compare one saved analysis and committed dataset
      x-implementation-status: implemented
      description: Implemented 16 Nov 2026 (branch 2). See api-spec.md.
      responses:
        '415':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '201':
          description: Planned successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonRequest'
    parameters:
    - name: analysis_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /v1/comparisons/{comparison_id}:
    parameters:
    - name: comparison_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - workspace
      operationId: getComparison
      x-implementation-status: implemented
      summary: Reopen stored comparison snapshot
      responses:
        '200':
          description: Immutable saved comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
components:
  headers:
    RequestId:
      description: Opaque id for support. Never derived from the input.
      schema: {type: string}
  parameters:
    UniprotId:
      name: uniprot_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UniprotId'}
    TileIndex:
      name: tile_index
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ShareToken:
      name: X-Share-Token
      in: header
      required: true
      description: Plain share token returned by `POST /v1/runs`.
      schema: {type: string, minLength: 22, maxLength: 64}
  responses:
    Error:
      description: Error. The `code` is stable; the `message` is for humans.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            length:
              summary: Sequence of the wrong length
              value:
                code: INVALID_LENGTH
                message: 'The sequence must have exactly 28 amino acids; it has 27.'
                field: sequence
            outOfDomain:
              summary: Stable tile
              value:
                code: OUT_OF_DOMAIN
                message: 'The measured wild-type PSI of this tile (4.8) is above the 4.0 limit of the training domain. Set override_domain to true to score it anyway.'
                field: null
  schemas:
    UniprotId:
      type: string
      pattern: '^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$'
      examples: [P60484, A6NMZ7]
    AminoAcid:
      type: string
      pattern: '^[ACDEFGHIKLMNPQRSTVWY]$'
    TileSequence:
      type: string
      pattern: '^[ACDEFGHIKLMNPQRSTVWY]{28}$'
      description: Exactly 28 standard amino acids, upper case.
    ExportFormat:
      type: string
      enum: [csv, json]
    DomainStatus:
      type: string
      enum:
        - measured_in_domain
        - measured_out_of_domain
        - measured_unreliable
        - measured_borderline   # R3 gate tier 1, between the in/out cuts (app/DEVIATIONS.md §7, §8)
        - predicted_in_domain
        - predicted_out_of_domain
        - predicted_borderline  # R3 gate tier 2 (typed or unmeasured sequence)
        - unknown
    RequestTarget:
      description: |
        Exactly one of `sequence` or the pair `uniprot_id` + `tile_index`. This schema only states that rule;
        the property lists are in `PredictRequest`, `ExportRequest` and `RunRequest`, each of which is closed
        (`additionalProperties: false`) so that an unknown field is a 422.
      oneOf:
        - required: [sequence]
          not: {anyOf: [{required: [uniprot_id]}, {required: [tile_index]}]}
        - required: [uniprot_id, tile_index]
          not: {required: [sequence]}
    RequestSequence:
      type: string
      maxLength: 64
      description: |
        The server upper-cases and trims it, then requires `TileSequence`. The loose
        `maxLength` only exists so that an over-long input gets `INVALID_LENGTH` rather than
        a schema error.
    RequestTileIndex:
      type: integer
      minimum: 1
    RequestModelId:
      type: string
      description: Defaults to the frozen default model.
    RequestCalibrator:
      type: string
      enum: [platt, iso]
      description: Defaults to the one stored with the model.
    RequestOverrideDomain:
      type: boolean
      default: false
      description: Score a tile that is measured to be outside the training domain. The result then carries the warning `OUT_OF_DOMAIN_OVERRIDDEN`.
    PredictRequest:
      type: object
      description: Exactly one of `sequence` or the pair `uniprot_id` + `tile_index`.
      additionalProperties: false
      properties:
        sequence: {$ref: '#/components/schemas/RequestSequence'}
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        tile_index: {$ref: '#/components/schemas/RequestTileIndex'}
        model_id: {$ref: '#/components/schemas/RequestModelId'}
        calibrator: {$ref: '#/components/schemas/RequestCalibrator'}
        override_domain: {$ref: '#/components/schemas/RequestOverrideDomain'}
      allOf:
        - $ref: '#/components/schemas/RequestTarget'
    ExportRequest:
      type: object
      description: A `PredictRequest` plus the file format. Written out in full because a closed schema cannot be extended with `allOf`.
      additionalProperties: false
      required: [format]
      properties:
        sequence: {$ref: '#/components/schemas/RequestSequence'}
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        tile_index: {$ref: '#/components/schemas/RequestTileIndex'}
        model_id: {$ref: '#/components/schemas/RequestModelId'}
        calibrator: {$ref: '#/components/schemas/RequestCalibrator'}
        override_domain: {$ref: '#/components/schemas/RequestOverrideDomain'}
        format: {$ref: '#/components/schemas/ExportFormat'}
      allOf:
        - $ref: '#/components/schemas/RequestTarget'
    RunRequest:
      type: object
      description: A `PredictRequest` plus the lifetime of the share link. Written out in full for the same reason as `ExportRequest`.
      additionalProperties: false
      properties:
        sequence: {$ref: '#/components/schemas/RequestSequence'}
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        tile_index: {$ref: '#/components/schemas/RequestTileIndex'}
        model_id: {$ref: '#/components/schemas/RequestModelId'}
        calibrator: {$ref: '#/components/schemas/RequestCalibrator'}
        override_domain: {$ref: '#/components/schemas/RequestOverrideDomain'}
        ttl_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
      allOf:
        - $ref: '#/components/schemas/RequestTarget'
    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - DOMAIN_UNKNOWN
            - DOMAIN_UNRELIABLE
            - DOMAIN_BORDERLINE
            - OUT_OF_DOMAIN_OVERRIDDEN
            - PREDICTED_DOMAIN
            - TRAINING_PEPTIDE
        message: {type: string}
    Cell:
      type: object
      required: [position, wt_aa, mut_aa, score_dpsi_raw, p_dpsi_ge_1_calibrated, rank_in_tile, top10pct_in_tile]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 28
          description: 1-based within the tile.
        wt_aa: {$ref: '#/components/schemas/AminoAcid'}
        mut_aa: {$ref: '#/components/schemas/AminoAcid'}
        score_dpsi_raw:
          type: number
          description: Raw regression output of the ridge model. Not a probability and not clipped.
        p_dpsi_ge_1_calibrated:
          type: number
          minimum: 0
          maximum: 1
          description: Calibrated probability of the event `DeltaPSI >= 1.0` for this assay and domain.
        rank_in_tile:
          type: integer
          minimum: 1
          maximum: 532
          description: 1 is the highest raw score within the tile.
        top10pct_in_tile:
          type: boolean
        score_seed_sd:
          type: [number, 'null']
          minimum: 0
          description: |
            Ensemble models only (plan-system 1.3): population standard deviation (ddof = 0) of the per-seed raw scores
            of this substitution. Spread between training seeds — not a confidence interval and not a prediction error.
            Null for a model without seeds; absent in results saved before 18 Nov 2026.
        score_seed_min: {type: [number, 'null'], description: Lowest per-seed raw score (ensembles only; see score_seed_sd)}
        score_seed_max: {type: [number, 'null'], description: Highest per-seed raw score (ensembles only; see score_seed_sd)}
    DataSourceRef:
      type: object
      required: [source_id, name, version, license_name, attribution_text]
      properties:
        source_id: {type: string}
        name: {type: string}
        version: {type: string}
        license_name: {type: string}
        attribution_text: {type: string}
    Provenance:
      type: object
      description: Present in every 200 response that carries scores or overlays and written into every export.
      required: [model_id, weights_sha256, event_definition, evidence_label, domain_description, data_sources, code_version, generated_at, disclaimers]
      properties:
        model_id: {type: string}
        model_kind: {type: string}
        weights_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        feature_spec: {type: string}
        event_definition: {type: string, examples: ['P(DeltaPSI >= 1.0)']}
        evidence_label: {type: string}
        domain_description: {type: string}
        data_sources:
          type: array
          items: {$ref: '#/components/schemas/DataSourceRef'}
        code_version: {type: string}
        generated_at: {type: string, format: date-time}
        disclaimers:
          type: array
          minItems: 1
          items: {type: string}
    TileInfo:
      type: object
      required: [sequence]
      properties:
        uniprot_id: {oneOf: [{$ref: '#/components/schemas/UniprotId'}, {type: 'null'}]}
        tile_index: {type: [integer, 'null']}
        start_pos: {type: [integer, 'null']}
        end_pos: {type: [integer, 'null']}
        sequence: {$ref: '#/components/schemas/TileSequence'}
    DomainInfo:
      type: object
      required: [status, message]
      properties:
        status: {$ref: '#/components/schemas/DomainStatus'}
        psi_wt_measured: {type: [number, 'null']}
        reads_measured: {type: [number, 'null']}
        gate_model_id: {type: [string, 'null']}
        gate_weights_sha256: {type: [string, 'null'], description: Planned v0.2 frozen gate provenance.}
        measurement_estimator: {type: [string, 'null'], description: Planned v0.2 distinction between screen and intrinsic estimators.}
        message: {type: string}
    PredictionResult:
      type: object
      required: [provenance, tile, domain, warnings, cells]
      properties:
        provenance: {$ref: '#/components/schemas/Provenance'}
        tile: {$ref: '#/components/schemas/TileInfo'}
        domain: {$ref: '#/components/schemas/DomainInfo'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
        cells:
          type: array
          minItems: 532
          maxItems: 532
          items: {$ref: '#/components/schemas/Cell'}
    ProteinSummary:
      type: object
      required: [uniprot_id, length, n_tiles]
      properties:
        uniprot_id: {$ref: '#/components/schemas/UniprotId'}
        gene_symbol: {type: [string, 'null']}
        protein_name: {type: [string, 'null']}
        length: {type: integer}
        n_tiles: {type: integer}
    TileSummary:
      type: object
      required: [tile_index, start_pos, end_pos, sequence, scorable, domain_status]
      properties:
        tile_index: {type: integer, minimum: 1}
        start_pos: {type: integer}
        end_pos: {type: integer}
        sequence: {type: string, minLength: 28, maxLength: 28}
        scorable: {type: boolean}
        domain_status: {$ref: '#/components/schemas/DomainStatus'}
        psi_wt_measured: {type: [number, 'null']}
        reads_measured: {type: [number, 'null']}
    TileList:
      type: object
      required: [protein, tiles, provenance]
      properties:
        protein: {$ref: '#/components/schemas/ProteinSummary'}
        tiles:
          type: array
          items: {$ref: '#/components/schemas/TileSummary'}
        provenance:
          $ref: '#/components/schemas/Provenance'
    MeasuredCell:
      type: object
      required: [position, mut_aa, delta_psi, in_training_set]
      properties:
        position: {type: integer, minimum: 1, maximum: 28}
        mut_aa: {$ref: '#/components/schemas/AminoAcid'}
        delta_psi: {type: number}
        in_training_set: {type: boolean}
    MeasuredOverlay:
      type: object
      required: [tile, cells, provenance]
      properties:
        tile: {$ref: '#/components/schemas/TileInfo'}
        cells:
          type: array
          items: {$ref: '#/components/schemas/MeasuredCell'}
        provenance:
          $ref: '#/components/schemas/Provenance'
    ClinvarVariant:
      type: object
      required: [variation_id, protein_pos, position, ref_aa, alt_aa, clinsig]
      properties:
        variation_id: {type: integer}
        protein_pos: {type: integer}
        position: {type: integer, minimum: 1, maximum: 28, description: Position inside the tile.}
        ref_aa: {$ref: '#/components/schemas/AminoAcid'}
        alt_aa: {$ref: '#/components/schemas/AminoAcid'}
        clinsig:
          type: string
          enum: [pathogenic, likely_pathogenic, vus, likely_benign, benign, conflicting, other]
        review_status: {type: [string, 'null']}
        last_evaluated: {type: [string, 'null'], format: date}
    ClinvarOverlay:
      description: Baseline payload; optional annotation_status is a planned v0.2 addition.
      type: object
      required: [tile, variants, clinvar_file_date, provenance]
      properties:
        annotation_status: {$ref: '#/components/schemas/AnnotationState'}
        tile: {$ref: '#/components/schemas/TileInfo'}
        variants:
          type: array
          items: {$ref: '#/components/schemas/ClinvarVariant'}
        clinvar_file_date: {type: string, format: date}
        provenance:
          $ref: '#/components/schemas/Provenance'
    ModelSummary:
      type: object
      required: [model_id, role, status, is_default, serving, not_serving_reason, expected_tile_seconds]
      properties:
        model_id: {type: string}
        role: {type: string, enum: [effect, gate]}
        kind: {type: string}
        status: {type: string, enum: [candidate, frozen, retired]}
        is_default: {type: boolean}
        serving:
          type: boolean
          description: |
            True when a request can use this model now (effect: loaded with a matching weights hash; gate: the gate
            loaded by this service). Clients list models that do not serve but do not let the user choose them.
        not_serving_reason: {type: [string, 'null'], description: Why the model is not serving; null when it serves}
        expected_tile_seconds:
          type: [number, 'null']
          minimum: 0
          description: |
            Mean seconds of the model's own scoring of one tile over the last measured computations in the answering
            process (no database time, no cache hits); before the first one, the median worker time of the last job
            items scored with this model (includes their database work). Null when neither exists and for the gate. An
            estimate for the user, not a guarantee.
    ModelCard:
      allOf:
        - $ref: '#/components/schemas/ModelSummary'
        - type: object
          required: [weights_sha256, event_definition, domain_description, evidence_label, metrics, trained_on_sources, card_markdown, not_used_sources]
          properties:
            weights_sha256: {type: string}
            event_definition: {type: string}
            domain_description: {type: string}
            evidence_label: {type: string}
            metrics:
              type: object
              additionalProperties: true
              description: Copied from the experiment results file named in `metrics_source_file`.
            metrics_source_file: {type: string}
            calibration:
              type:
                - object
                - 'null'
              additionalProperties: true
            trained_on_sources:
              type: array
              items: {$ref: '#/components/schemas/DataSourceRef'}
            card_markdown: {type: string}
            not_used_sources:
              type: array
              description: |
                Sources that were examined and are deliberately not served and not used to train this model
                (licence, scale or coverage reasons). Clients show this list on the model card (ui-design §3.5).
              items: {$ref: '#/components/schemas/NotUsedSource'}
            frozen_at: {type: [string, 'null'], format: date-time}
    NotUsedSource:
      type: object
      required: [source_id, name, reason]
      properties:
        source_id: {type: string}
        name: {type: string}
        reason: {type: string}
    DataSource:
      type: object
      required: [source_id, name, version, citation, license_name, attribution_text]
      properties:
        source_id: {type: string}
        name: {type: string}
        version: {type: string}
        citation: {type: string}
        url: {type: [string, 'null']}
        license_name: {type: string}
        attribution_text: {type: string}
        disclaimer_text: {type: [string, 'null']}
    RunCreated:
      type: object
      required: [run_id, share_token, expires_at, result]
      properties:
        run_id: {type: string, format: uuid}
        share_token:
          type: string
          description: Shown once. Put it in the URL fragment.
        expires_at: {type: string, format: date-time}
        result:
          $ref: '#/components/schemas/PredictionResult'
    Health:
      type: object
      required: [status, version, model_loaded, database]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
        model_loaded: {type: boolean}
        default_model_id: {type: [string, 'null']}
        database: {type: string, enum: [ok, unavailable]}
        default_model_source:
          type: [string, 'null']
          enum: [registry, setting, fallback, null]
          description: |
            Where the default effect model came from: the registry flag, the DF_DEFAULT_MODEL_ID setting, or the first
            serving model when neither applies. A default must match a serving decision record (system/serving-policy.md).
        default_model_sha256: {type: [string, 'null'], description: SHA-256 of the default model's registered weights file}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_LENGTH
            - INVALID_CHARACTER
            - INVALID_FORMAT
            - UNKNOWN_ACCESSION
            - TILE_OUT_OF_RANGE
            - TILE_NOT_SCORABLE
            - OUT_OF_DOMAIN
            - MODEL_NOT_FOUND
            - RUN_NOT_FOUND
            - RUN_EXPIRED
            - TOKEN_REQUIRED
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
            - PROJECT_NOT_FOUND
            - ANALYSIS_NOT_FOUND
            - JOB_NOT_FOUND
            - DATASET_NOT_FOUND
            - CONFIRMATION_REQUIRED
            - IMPORT_INVALID
            - DATASET_NOT_COMMITTED
            - INCOMPATIBLE_ENDPOINT
            - JOB_STATE_CONFLICT
            - SNAPSHOT_UNAVAILABLE
            - COMPARISON_NOT_FOUND
            - IMPORT_EXPIRED
            - LOCAL_ONLY
        message: {type: string}
        dependencies:
          type: object
          description: Planned 409 CONFIRMATION_REQUIRED dependency counts; no deletion performed.
          additionalProperties: {type: integer, minimum: 0}
        field:
          type: [string, 'null']
          description: Name of the offending request field, when there is one.

    ProjectWrite:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
      required:
      - name
    Project:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        counts:
          type: object
          description: Owned records shown on the project card (screen Projects).
          additionalProperties: false
          properties:
            analyses: {type: integer, minimum: 0}
            jobs: {type: integer, minimum: 0}
            datasets: {type: integer, minimum: 0}
          required: [analyses, jobs, datasets]
        deletion_pending:
          type: boolean
          description: A confirmed deletion could not remove the project files; repeat the deletion to finish it.
      required:
      - project_id
      - name
      - created_at
      - updated_at
      - counts
    SaveAnalysisRequest:
      type: object
      additionalProperties: false
      properties:
        request:
          $ref: '#/components/schemas/PredictRequest'
        parent_analysis_id:
          type: string
          format: uuid
      required:
      - request
    SavedAnalysis:
      type: object
      additionalProperties: false
      properties:
        analysis_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        parent_analysis_id:
          type:
          - string
          - 'null'
          format: uuid
        parent_available:
          type: boolean
          description: False when the parent analysis was deleted; the lineage id is kept, the parent is not recreated.
        created_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/PredictionResult'
        snapshot:
          type: object
          additionalProperties: true
          description: Versioned structured snapshot; required semantic fields are specified in api-spec.md. Never filled
            from mutable current sources when reopening history.
      required:
      - analysis_id
      - project_id
      - created_at
      - result
      - snapshot
    BatchPeptide:
      type: object
      additionalProperties: false
      properties:
        input_id:
          type: string
          minLength: 1
          maxLength: 200
        sequence:
          type: string
          maxLength: 64
      required:
      - input_id
      - sequence
    ProteinInput:
      type: object
      additionalProperties: false
      properties:
        input_id:
          type: string
        uniprot_id:
          $ref: '#/components/schemas/UniprotId'
        sequence:
          type: string
          minLength: 1
          maxLength: 10000
        reference_release:
          type: string
      description: Exactly one of uniprot_id or sequence; optional mapping must be verified.
      oneOf:
      - required:
        - uniprot_id
        not:
          required:
          - sequence
      - required:
        - input_id
        - sequence
        not:
          required:
          - uniprot_id
    JobRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - peptides
          - protein
        peptides:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchPeptide'
        protein:
          $ref: '#/components/schemas/ProteinInput'
        proteins:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            plan-system 3.3 (18 Nov 2026): several proteins (accessions and/or FASTA records) in one protein job. The
            residue limit applies to their total; a protein that cannot be resolved becomes one refused item and does
            not stop the others. Item ids are p<protein>t<tile>.
          items:
            $ref: '#/components/schemas/ProteinInput'
        model_id:
          type: string
        calibrator:
          $ref: '#/components/schemas/RequestCalibrator'
        override_domain:
          type: boolean
          default: false
        priority:
          type: string
          enum: [normal, high]
          description: |
            plan-system 4.5. Jobs of at most 10 items are high priority automatically; "high" raises a larger job, never
            lowers one. At most 2 items of one job run at the same time, so a long scan cannot take every worker.
      required:
      - mode
      oneOf:
      - properties:
          mode:
            const: peptides
        required:
        - peptides
        not:
          required:
          - protein
      - properties:
          mode:
            const: protein
        oneOf:
        - required: [protein]
          not:
            anyOf:
            - required: [peptides]
            - required: [proteins]
        - required: [proteins]
          not:
            anyOf:
            - required: [peptides]
            - required: [protein]
    Job:
      type: object
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - peptides
          - protein
        state:
          type: string
          enum:
          - pending
          - running
          - completed
          - partial
          - failed
          - cancelled
        total:
          type: integer
          minimum: 0
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        coverage:
          type: object
          additionalProperties: true
          description: Versioned structured snapshot; required semantic fields are specified in api-spec.md. Never filled
            from mutable current sources when reopening history.
        configuration_snapshot:
          type: object
          additionalProperties: true
          description: Versioned structured snapshot; required semantic fields are specified in api-spec.md. Never filled
            from mutable current sources when reopening history.
        cancel_requested:
          type: boolean
          description: Cancellation was requested; items already finished are kept (FR-26).
        priority:
          type: string
          enum: [normal, high]
          description: plan-system 4.5 — workers claim items of high-priority jobs first (small jobs, or asked by the user)
        eta_seconds:
          type:
          - number
          - 'null'
          minimum: 0
          description: |
            Estimated seconds until the open items (pending + running) are done (plan-system 1.7): mean worker time of
            the job's last finished items (up to 20) × open items, for one worker. Null when fewer than 3 items have a
            measured time, and when the job is finished. An estimate, not a guarantee.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - job_id
      - project_id
      - mode
      - state
      - total
      - counts
      - configuration_snapshot
      - eta_seconds
      - created_at
      - updated_at
    AgreementSeries:
      type: object
      required: [project_id, caveat, points, rules, flagged]
      properties:
        project_id: {type: string, format: uuid}
        caveat: {type: string}
        rules: {type: object, additionalProperties: true}
        flagged: {type: integer}
        points:
          type: array
          items:
            type: object
            required: [comparison_id, analysis_id, dataset_id, model_id, created_at, n, compatible, mae, spearman, flags]
            properties:
              comparison_id: {type: string, format: uuid}
              analysis_id: {type: string, format: uuid}
              dataset_id: {type: string, format: uuid}
              dataset_name: {type: [string, 'null']}
              dataset_revision: {type: [integer, 'null']}
              model_id: {type: string}
              tile: {type: string}
              created_at: {type: string, format: date-time}
              n: {type: integer}
              compatible: {type: boolean}
              mae: {type: [number, 'null']}
              spearman: {type: [number, 'null']}
              flags:
                type: array
                items:
                  type: object
                  required: [code, text]
                  properties:
                    code: {type: string, enum: [mae_worse, spearman_worse]}
                    text: {type: string}
    AdminStatus:
      type: object
      required: [generated_at, version, code_version, models, cache, schema_revision, etl, queue, workers, storage]
      properties:
        generated_at: {type: string, format: date-time}
        version: {type: string}
        code_version: {type: string}
        schema_revision: {type: [string, 'null']}
        models: {type: object, additionalProperties: true}
        cache: {type: object, additionalProperties: true}
        etl: {type: [object, 'null'], additionalProperties: true}
        queue: {type: object, additionalProperties: true}
        workers: {type: object, additionalProperties: true}
        storage: {type: object, additionalProperties: true}
    Suggestions:
      type: object
      required: [analysis_id, compared_with, label, criteria, domain_status, model_id, candidates, excluded_reason]
      properties:
        analysis_id: {type: string, format: uuid}
        compared_with: {type: [string, 'null'], format: uuid}
        compared_model_id: {type: string}
        label: {type: string, description: Shown before the list}
        criteria: {type: object, additionalProperties: true}
        domain_status: {type: string}
        model_id: {type: string}
        n_with_reason: {type: integer}
        excluded_reason: {type: [string, 'null']}
        candidates:
          type: array
          items:
            type: object
            required: [position, wt_aa, mut_aa, score_dpsi_raw, prob, prob_other, rank_in_tile, score_seed_sd, reasons]
            properties:
              position: {type: integer}
              wt_aa: {type: string}
              mut_aa: {type: string}
              score_dpsi_raw: {type: number}
              prob: {type: number}
              prob_other: {type: [number, 'null']}
              rank_in_tile: {type: integer}
              score_seed_sd: {type: [number, 'null']}
              reasons:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [code, value, text]
                  properties:
                    code: {type: string, enum: [high_score_uncertain, models_disagree, clinvar_variant]}
                    value: {type: number}
                    text: {type: string}
    ModelComparisonCell:
      type: object
      additionalProperties: false
      required: [position, wt_aa, mut_aa, raw_a, raw_b, prob_a, prob_b, rank_a, rank_b]
      properties:
        position: {type: integer, minimum: 1, maximum: 28}
        wt_aa: {type: string}
        mut_aa: {type: string}
        raw_a: {type: number}
        raw_b: {type: number}
        prob_a: {type: number, minimum: 0, maximum: 1}
        prob_b: {type: number, minimum: 0, maximum: 1}
        rank_a: {type: integer, minimum: 1, maximum: 532}
        rank_b: {type: integer, minimum: 1, maximum: 532}
        diff_prob: {type: number}
        diff_raw: {type: number}
    ModelComparisonSide:
      type: object
