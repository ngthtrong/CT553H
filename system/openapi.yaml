      properties:
        analysis_id: {type: string, format: uuid}
        model_id: {type: string}
        model_kind: {type: [string, 'null']}
        weights_sha256: {type: string}
        calibrator: {type: [string, 'null']}
        evidence_label: {type: string}
        domain_status: {type: string}
        warning_codes: {type: array, items: {type: string}}
        created_at: {type: [string, 'null']}
    ModelComparison:
      type: object
      additionalProperties: false
      required: [comparison_id, project_id, label, tile, sequence_sha256, metrics, disagreements, provenance, cells, created_at]
      properties:
        comparison_id: {type: [string, 'null'], format: uuid, description: null when not stored}
        project_id: {type: string, format: uuid}
        label: {type: string, description: Shown before the numbers (descriptive; does not say which model is right)}
        tile: {$ref: '#/components/schemas/TileInfo'}
        sequence_sha256: {type: string}
        metrics:
          type: object
          required: [n_cells, spearman_raw, pearson_raw, spearman_prob, mean_abs_diff_raw, mean_abs_diff_prob, max_abs_diff_prob, top_k, top_k_overlap, top_k_jaccard]
          properties:
            n_cells: {type: integer}
            spearman_raw: {type: [number, 'null']}
            pearson_raw: {type: [number, 'null']}
            spearman_prob: {type: [number, 'null']}
            mean_abs_diff_raw: {type: [number, 'null']}
            mean_abs_diff_prob: {type: [number, 'null']}
            max_abs_diff_prob: {type: [number, 'null']}
            top_k: {type: integer}
            top_k_overlap: {type: integer}
            top_k_jaccard: {type: [number, 'null']}
        disagreements:
          type: array
          description: Up to 20 cells with the largest |prob_b − prob_a|, ties by position then mutant
          items: {$ref: '#/components/schemas/ModelComparisonCell'}
        provenance:
          type: object
          required: [a, b]
          properties:
            a: {$ref: '#/components/schemas/ModelComparisonSide'}
            b: {$ref: '#/components/schemas/ModelComparisonSide'}
        cells:
          type: array
          items: {$ref: '#/components/schemas/ModelComparisonCell'}
        created_at: {type: [string, 'null'], format: date-time}
    ModelComparisonSummary:
      type: object
      additionalProperties: false
      required: [comparison_id, project_id, analysis_a, analysis_b, model_a, model_b, spearman_raw, top_k_jaccard, created_at]
      properties:
