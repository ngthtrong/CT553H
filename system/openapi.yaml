    JobFootprint:
      type: object
      additionalProperties: false
      required: [job_id, state, label, protein, uncovered, model, tiles]
      properties:
        proteins:
          type: array
          items: {type: [string, 'null']}
          description: input_ids of the scored proteins of the job (several since plan-system 3.3); this answer is for `protein.input_id`
        job_id: {type: string, format: uuid}
        state: {type: string, enum: [completed, partial, failed, cancelled]}
        label:
          type: string
          description: Limitation text clients show before the numbers (each tile scored on its own; not a protein phenotype).
        protein:
          type: object
          additionalProperties: false
          required: [input_id, uniprot_id, length, tiles]
          properties:
            input_id: {type: string}
            uniprot_id: {type: [string, 'null']}
            length: {type: integer, minimum: 28}
            tiles: {type: integer, minimum: 1}
        uncovered:
          type: array
          items:
            type: object
            required: [start, end]
            properties:
              start: {type: integer, minimum: 1}
              end: {type: integer, minimum: 1}
        model:
          type: object
          additionalProperties: false
          required: [model_id, weights_sha256, calibrator, event_definition]
          properties:
            model_id: {type: string}
            weights_sha256: {type: string}
            calibrator: {type: string}
            event_definition: {type: string}
        tiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item_id, tile_index, start_pos, end_pos, state, domain_status, analysis_id, training_peptide, positions]
            properties:
              item_id: {type: string}
              tile_index: {type: integer, minimum: 1}
              start_pos: {type: integer, minimum: 1}
              end_pos: {type: integer, minimum: 28}
              state: {type: string, enum: [pending, running, succeeded, refused, failed, cancelled]}
              domain_status: {type: [string, 'null']}
              analysis_id: {type: [string, 'null'], format: uuid}
              training_peptide:
                type: [boolean, 'null']
                description: The scored tile carried the TRAINING_PEPTIDE warning; null when the tile was not scored.
              positions:
                type: array
                description: 28 entries for a scored tile, empty otherwise.
                items:
                  type: object
                  additionalProperties: false
                  required: [protein_pos, mean_prob, mean_raw]
                  properties:
                    protein_pos: {type: integer, minimum: 1}
                    mean_prob: {type: number, minimum: 0, maximum: 1}
                    mean_raw: {type: number}
