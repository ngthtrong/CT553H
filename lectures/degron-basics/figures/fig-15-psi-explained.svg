<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">PSI đến từ đâu: sáu cái thùng và một phép trung bình có trọng số</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <text x="16" y="48" font-size="10" fill="#64748b">Dòng thật trong dữ liệu quét: A0A0B4J271_TRAV12-3_4_mut13</text>

  <!-- buckets -->
  <text x="16" y="74" font-size="10.5" font-weight="700" fill="#334155">1. Máy chia tế bào vào 6 thùng theo độ sáng. Thùng 1 = protein bị phá hết, thùng 6 = protein còn nguyên.</text>

  <rect x="40" y="86" width="88" height="96" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="84" y="104" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">thùng 1</text>
  <text x="84" y="124" font-size="9" fill="#7f1d1d" text-anchor="middle">bị phá hết</text>
  <text x="84" y="152" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">38</text>
  <text x="84" y="168" font-size="8.5" fill="#991b1b" text-anchor="middle">tế bào đếm được</text>

  <rect x="136" y="86" width="88" height="96" rx="4" fill="#fff7ed" stroke="#f97316"/>
  <text x="180" y="104" font-size="10" font-weight="700" fill="#c2410c" text-anchor="middle">thùng 2</text>
  <text x="180" y="152" font-size="17" font-weight="700" fill="#c2410c" text-anchor="middle">53</text>

  <rect x="232" y="86" width="88" height="96" rx="4" fill="#fefce8" stroke="#eab308"/>
  <text x="276" y="104" font-size="10" font-weight="700" fill="#a16207" text-anchor="middle">thùng 3</text>
  <text x="276" y="152" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">76</text>

  <rect x="328" y="86" width="88" height="96" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="372" y="104" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">thùng 4</text>
  <text x="372" y="152" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">316</text>
  <text x="372" y="168" font-size="8.5" fill="#166534" text-anchor="middle">đông nhất</text>

  <rect x="424" y="86" width="88" height="96" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="468" y="104" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">thùng 5</text>
  <text x="468" y="152" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">128</text>

  <rect x="520" y="86" width="88" height="96" rx="4" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="564" y="104" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">thùng 6</text>
  <text x="564" y="124" font-size="9" fill="#5b21b6" text-anchor="middle">còn nguyên</text>
  <text x="564" y="152" font-size="17" font-weight="700" fill="#6d28d9" text-anchor="middle">29</text>

  <!-- step 2 -->
  <text x="16" y="208" font-size="10.5" font-weight="700" fill="#334155">2. Nhân mỗi thùng với số thứ tự của nó, rồi chia cho tổng. Đó chính là PSI.</text>

  <rect x="40" y="220" width="568" height="58" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="56" y="242" font-size="11" fill="#1e293b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">PSI = (1×38 + 2×53 + 3×76 + 4×316 + 5×128 + 6×29) / (38+53+76+316+128+29)</text>
  <text x="56" y="266" font-size="11" fill="#1e293b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">    = 2450 / 640  =  <tspan font-weight="700" fill="#15803d">3,83</tspan></text>

  <text x="624" y="238" font-size="9.5" fill="#64748b">thùng đông</text>
  <text x="624" y="250" font-size="9.5" fill="#64748b">nhất là 4,</text>
  <text x="624" y="262" font-size="9.5" fill="#64748b">nên PSI ≈ 4</text>
  <text x="56" y="292" font-size="9" fill="#94a3b8">Pipeline thật trước đó còn cân lại 6 thùng cho tổng read bằng nhau, nên số công bố là 3,84 — lệch không đáng kể.</text>

  <!-- scale -->
  <text x="16" y="312" font-size="10.5" font-weight="700" fill="#334155">3. Thang PSI chạy từ 1 đến 6. THẤP nghĩa là bị phá nhanh, tức degron mạnh.</text>

  <rect x="40" y="322" width="568" height="22" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="40" y="322" width="190" height="22" rx="4" fill="#fecaca"/>
  <rect x="230" y="322" width="188" height="22" fill="#fde68a"/>
  <rect x="418" y="322" width="190" height="22" fill="#bbf7d0"/>
  <text x="135" y="337" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">1–3: bị phá nhanh = LÀ degron</text>
  <text x="324" y="337" font-size="9.5" fill="#92400e" text-anchor="middle">3–4,5: lưng chừng</text>
  <text x="513" y="337" font-size="9.5" fill="#166534" text-anchor="middle">4,5–6: bền, không phải degron</text>

  <line x1="370" y1="348" x2="370" y2="360" stroke="#15803d" stroke-width="2"/>
  <text x="370" y="372" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">peptide ví dụ ở đây: 3,83</text>

  <!-- delta -->
  <rect x="40" y="384" width="568" height="24" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="52" y="400" font-size="10" fill="#1e3a8a">Nhãn mà đề tài học <tspan font-weight="700">không phải PSI</tspan>, mà là <tspan font-weight="700">ΔPSI = PSI(bản đột biến) − PSI(bản gốc)</tspan>. ΔPSI ≥ 1 ⇒ vị trí đó quan trọng.</text>
</svg>
