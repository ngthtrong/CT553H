<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Degron là đoạn trình tự khiến protein bị đem đi phân hủy</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <!-- step 1 -->
  <rect x="24" y="52" width="180" height="88" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="114" y="72" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">1. Protein trong tế bào</text>
  <line x1="44" y1="104" x2="184" y2="104" stroke="#52525b" stroke-width="2"/>
  <g><circle cx="56" cy="104" r="8" fill="#e4e4e7" stroke="#71717a"/><circle cx="76" cy="104" r="8" fill="#e4e4e7" stroke="#71717a"/>
  <rect x="88" y="94" width="48" height="20" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <circle cx="148" cy="104" r="8" fill="#e4e4e7" stroke="#71717a"/><circle cx="170" cy="104" r="8" fill="#e4e4e7" stroke="#71717a"/></g>
  <text x="112" y="130" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">degron</text>

  <path d="M212 96 L246 96" stroke="#52525b" stroke-width="2" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52525b"/></marker></defs>

  <!-- step 2 -->
  <rect x="252" y="52" width="196" height="88" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="350" y="72" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">2. Enzyme E3 nhận ra degron</text>
  <path d="M296 128 q22 -40 44 0" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
  <text x="318" y="138" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">E3</text>
  <rect x="300" y="88" width="36" height="16" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <g font-size="9" fill="#166534" text-anchor="middle">
    <circle cx="378" cy="92" r="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="378" y="96">Ub</text>
    <circle cx="402" cy="80" r="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="402" y="84">Ub</text>
    <circle cx="420" cy="100" r="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="420" y="104">Ub</text>
  </g>
  <text x="400" y="132" font-size="10" fill="#15803d" text-anchor="middle">gắn nhãn ubiquitin</text>

  <path d="M456 96 L490 96" stroke="#52525b" stroke-width="2" marker-end="url(#ah)"/>

  <!-- step 3 -->
  <rect x="496" y="52" width="200" height="88" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="596" y="72" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">3. Proteasome phân hủy</text>
  <path d="M540 86 h56 v34 h-56 z" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="568" y="107" font-size="9" fill="#312e81" text-anchor="middle">proteasome</text>
  <g font-size="11" fill="#71717a"><text x="622" y="95">·</text><text x="634" y="104">·</text><text x="648" y="94">·</text><text x="660" y="108">·</text><text x="672" y="98">·</text></g>
  <text x="648" y="130" font-size="10" fill="#52525b" text-anchor="middle">thành mảnh vụn</text>

  <!-- key idea -->
  <rect x="24" y="162" width="672" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="38" y="182" font-size="12" font-weight="700" fill="#1e3a8a">Ý chính: degron quyết định protein sống bao lâu.</text>
  <text x="38" y="200" font-size="11.5" fill="#1e40af">Degron mạnh → protein bị phân hủy nhanh → tế bào có ít protein đó. Degron yếu → protein bền hơn.</text>
  <text x="38" y="214" font-size="11.5" fill="#1e40af">Đổi một acid amin trong degron có thể làm nó mạnh hơn hoặc yếu đi. Đó là thứ đề tài này dự đoán.</text>

  <rect x="24" y="230" width="672" height="54" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="38" y="250" font-size="12" font-weight="700" fill="#991b1b">Vì sao điều này quan trọng với bệnh</text>
  <text x="38" y="268" font-size="11.5" fill="#b91c1c">Nếu một đột biến <tspan font-weight="700">tạo ra</tspan> degron mới, protein lành bị phá sớm → mất chức năng → có thể gây bệnh.</text>
  <text x="38" y="281" font-size="11.5" fill="#b91c1c">Nếu đột biến <tspan font-weight="700">phá</tspan> degron của một protein gây ung thư, protein đó tích tụ lại.</text>
</svg>
