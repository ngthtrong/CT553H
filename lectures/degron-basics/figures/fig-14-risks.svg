<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Rủi ro xếp theo mức nguy hiểm, và cách biết sớm</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <!-- risk bars -->
  <g font-size="10">
    <rect x="24" y="48" width="672" height="40" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="36" y="65" font-size="11" font-weight="700" fill="#991b1b">① Lực thống kê — nguy hiểm nhất</text>
    <text x="36" y="80" fill="#b91c1c">Tập test chỉ còn <tspan font-weight="700">221–322 footprint</tspan>. Cải thiện nhỏ có thể không chứng minh được, dù mô hình thật sự tốt hơn.</text>
    <rect x="556" y="54" width="130" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="621" y="66" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Biết sớm: tính power</text>
    <text x="621" y="77" font-size="9" fill="#15803d" text-anchor="middle">rẻ · CPU · dữ liệu đã có</text>

    <rect x="24" y="94" width="672" height="40" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="36" y="111" font-size="11" font-weight="700" fill="#9a3412">② Phần dư 35% có thể chỉ là nhiễu</text>
    <text x="36" y="126" fill="#c2410c">Một replicate, reads thấp, BAG6 chưa rõ. Nếu phần dư là nhiễu đo thì dư địa 0,1747 là ảo.</text>
    <rect x="556" y="100" width="130" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="621" y="112" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Biết sớm: kiểm ổn định</text>
    <text x="621" y="123" font-size="9" fill="#15803d" text-anchor="middle">giữa replicate và reads</text>

    <rect x="24" y="140" width="672" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="36" y="157" font-size="11" font-weight="700" fill="#92400e">③ G3 — ứng dụng không khác biệt được</text>
    <text x="36" y="172" fill="#b45309">DEGRONOPEDIA, MetaDegron web, Colab PAP đều đã có. "Làm thêm một web" không phải đóng góp.</text>
    <rect x="556" y="146" width="130" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="621" y="158" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Nhắm ma trận 28×20</text>
    <text x="621" y="169" font-size="9" fill="#15803d" text-anchor="middle">cả ba đều không có</text>

    <rect x="24" y="186" width="672" height="40" rx="5" fill="#fffbeb" stroke="#eab308"/>
    <text x="36" y="203" font-size="11" font-weight="700" fill="#854d0e">④ Kiến trúc có thể không thắng, hoặc không cần thiết</text>
    <text x="36" y="218" fill="#a16207">Khi đã có nhãn mức residue, đầu hồi quy theo vị trí là mô hình tự nhiên — MIL không bắt buộc.</text>
    <rect x="556" y="192" width="130" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="621" y="204" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Đối chứng bắt buộc</text>
    <text x="621" y="215" font-size="9" fill="#15803d" text-anchor="middle">không được bỏ qua</text>

    <rect x="24" y="232" width="672" height="40" rx="5" fill="#fafafa" stroke="#a1a1aa"/>
    <text x="36" y="249" font-size="11" font-weight="700" fill="#3f3f46">⑤ Tính mới bị thu hẹp thêm — đã bị thu hẹp 2 lần</text>
    <text x="36" y="264" fill="#52525b">BioBlobs (MIL trên protein) và Larsen 2025 (rASA/pLDDT + bản đồ ΔPAP) đã lấy đi hai phần.</text>
    <rect x="556" y="238" width="130" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="621" y="250" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">Phát biểu hẹp từ đầu</text>
    <text x="621" y="261" font-size="9" fill="#15803d" text-anchor="middle">thì không sụp khi có thêm</text>
  </g>

  <!-- three things first -->
  <rect x="24" y="284" width="672" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="38" y="303" font-size="11.5" font-weight="700" fill="#1e3a8a">Ba việc trước khi viết dòng code huấn luyện đầu tiên — cả ba KHÔNG cần GPU, KHÔNG cần tải thêm dữ liệu</text>
  <text x="38" y="321" font-size="10.5" fill="#1e40af"><tspan font-weight="700">1.</tspan> Tính lực thống kê trên n = 221–322 → quyết định đề tài đứng hay sụp</text>
  <text x="38" y="334" font-size="10.5" fill="#1e40af"><tspan font-weight="700">2.</tspan> Kiểm ổn định nhãn giữa replicate và theo độ sâu reads → quyết định dư địa 0,1747 là thật hay ảo</text>
  <text x="38" y="345" font-size="10.5" fill="#1e40af"><tspan font-weight="700">3.</tspan> Thống nhất thước đo với GVHD ở tuần 6 → quyết định đề tài được đánh giá bằng thước nào</text>
</svg>
