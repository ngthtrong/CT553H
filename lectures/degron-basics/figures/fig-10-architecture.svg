<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="390" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Giải pháp đề xuất: MIL-Degron (5 thành phần)</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG — ĐỀ XUẤT, CHƯA KIỂM CHỨNG</text>
  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52525b"/></marker></defs>

  <!-- 1 peptide -->
  <text x="24" y="52" font-size="10.5" font-weight="700" fill="#18181b">① Peptide → mỗi vị trí sinh một cửa sổ ("túi" các cửa sổ)</text>
  <g font-size="9" text-anchor="middle">
    <rect x="28" y="60" width="18" height="20" fill="#e4e4e7" stroke="#a1a1aa"/><text x="37" y="74" fill="#3f3f46">M</text>
    <rect x="48" y="60" width="18" height="20" fill="#e4e4e7" stroke="#a1a1aa"/><text x="57" y="74" fill="#3f3f46">K</text>
    <rect x="68" y="60" width="18" height="20" fill="#e4e4e7" stroke="#a1a1aa"/><text x="77" y="74" fill="#3f3f46">T</text>
    <rect x="88" y="60" width="18" height="20" fill="#e4e4e7" stroke="#a1a1aa"/><text x="97" y="74" fill="#3f3f46">A</text>
    <rect x="108" y="60" width="18" height="20" fill="#e4e4e7" stroke="#a1a1aa"/><text x="117" y="74" fill="#3f3f46">L</text>
    <rect x="128" y="60" width="18" height="20" fill="#e4e4e7" stroke="#a1a1aa"/><text x="137" y="74" fill="#3f3f46">G</text>
    <text x="156" y="74" fill="#71717a">…</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="1.5">
    <rect x="26" y="88" width="58" height="14" rx="3"/><rect x="66" y="106" width="58" height="14" rx="3"/><rect x="106" y="124" width="58" height="14" rx="3"/>
  </g>
  <text x="172" y="99" font-size="9" fill="#2563eb">cửa sổ 1</text>
  <text x="172" y="117" font-size="9" fill="#2563eb">cửa sổ 2</text>
  <text x="172" y="135" font-size="9" fill="#2563eb">cửa sổ 3 …</text>

  <!-- 2 PLM -->
  <path d="M236 100 L268 100" stroke="#52525b" stroke-width="2" marker-end="url(#a4)"/>
  <rect x="274" y="58" width="128" height="84" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="338" y="78" font-size="10.5" font-weight="700" fill="#5b21b6" text-anchor="middle">② Embedding PLM</text>
  <text x="338" y="94" font-size="10" fill="#6d28d9" text-anchor="middle">mức RESIDUE</text>
  <text x="338" y="112" font-size="9.5" fill="#7c3aed" text-anchor="middle">không gộp trung bình</text>
  <text x="338" y="126" font-size="9.5" fill="#7c3aed" text-anchor="middle">trước khi vào mô hình</text>
  <text x="338" y="138" font-size="8.5" fill="#a78bfa" text-anchor="middle">(khác mọi mô hình degron đã công bố)</text>

  <!-- 3 attention -->
  <path d="M406 100 L438 100" stroke="#52525b" stroke-width="2" marker-end="url(#a4)"/>
  <rect x="444" y="58" width="128" height="84" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="508" y="78" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">③ Attention có cổng</text>
  <text x="508" y="96" font-size="9.5" fill="#b45309" text-anchor="middle">thay global average</text>
  <text x="508" y="108" font-size="9.5" fill="#b45309" text-anchor="middle">pooling</text>
  <g>
    <rect x="462" y="116" width="12" height="8" fill="#fbbf24"/><rect x="478" y="113" width="12" height="11" fill="#dc2626"/>
    <rect x="494" y="119" width="12" height="5" fill="#fbbf24"/><rect x="510" y="112" width="12" height="12" fill="#dc2626"/>
    <rect x="526" y="118" width="12" height="6" fill="#fbbf24"/><rect x="542" y="120" width="12" height="4" fill="#fbbf24"/>
  </g>
  <text x="508" y="136" font-size="8.5" fill="#92400e" text-anchor="middle">trọng số từng cửa sổ</text>

  <!-- 4 exposure gate -->
  <rect x="444" y="154" width="128" height="58" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="508" y="172" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">④ Cổng phơi lộ</text>
  <text x="508" y="188" font-size="9.5" fill="#15803d" text-anchor="middle">rASA và pLDDT nhân vào</text>
  <text x="508" y="200" font-size="9.5" fill="#15803d" text-anchor="middle">logit của attention</text>
  <path d="M508 154 L508 144" stroke="#15803d" stroke-width="2" marker-end="url(#a4)"/>

  <!-- 5 two heads -->
  <path d="M576 100 L606 100" stroke="#52525b" stroke-width="2" marker-end="url(#a4)"/>
  <rect x="612" y="58" width="84" height="40" rx="5" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="654" y="74" font-size="9.5" font-weight="700" fill="#3f3f46" text-anchor="middle">⑤a điểm khối</text>
  <text x="654" y="88" font-size="8.5" fill="#71717a" text-anchor="middle">(phụ trợ)</text>
  <rect x="612" y="104" width="84" height="48" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="654" y="120" font-size="9.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">⑤b bản đồ</text>
  <text x="654" y="132" font-size="9.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">theo residue</text>
  <text x="654" y="145" font-size="8.5" fill="#2563eb" text-anchor="middle">MỤC TIÊU</text>

  <!-- why -->
  <rect x="24" y="226" width="336" height="72" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="38" y="246" font-size="11" font-weight="700" fill="#1e3a8a">Vì sao cần cấu trúc "túi"?</text>
  <text x="38" y="264" font-size="10.5" fill="#1e40af">Để dùng được CẢ HAI bộ nhãn trong MỘT mô hình:</text>
  <text x="38" y="278" font-size="10.5" fill="#1e40af">đầu khối đọc nhãn đoạn (212.658), đầu residue</text>
  <text x="38" y="292" font-size="10.5" fill="#1e40af">đọc nhãn vị trí (256.711).</text>

  <rect x="372" y="226" width="324" height="72" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="386" y="246" font-size="11" font-weight="700" fill="#991b1b">Giới hạn phải tự nói ra</text>
  <text x="386" y="264" font-size="10.5" fill="#b91c1c">Khi đã có nhãn mức residue, một đầu hồi quy theo</text>
  <text x="386" y="278" font-size="10.5" fill="#b91c1c">vị trí là mô hình tự nhiên — MIL không bắt buộc.</text>
  <text x="386" y="292" font-size="10.5" font-weight="700" fill="#991b1b">Nếu nó đã đủ thì phải báo, không được che.</text>

  <rect x="24" y="310" width="672" height="68" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="38" y="330" font-size="11" font-weight="700" fill="#78350f">Tính mới phải phát biểu hẹp đúng mức</text>
  <text x="38" y="348" font-size="10.5" fill="#92400e">BioBlobs (2025) đã dùng attention-MIL trên protein. OmniESI (2025) đã dùng điều biến có điều kiện hai chiều.</text>
  <text x="38" y="362" font-size="10.5" fill="#92400e">Nói đúng: <tspan font-weight="700">mới ở chỗ ghép và ở chỗ đặt cổng phơi lộ tại bước gộp, chưa thấy áp cho degron.</tspan></text>
  <text x="38" y="374" font-size="10.5" font-weight="700" fill="#991b1b">KHÔNG mới ở cơ chế. Không được nói "chưa ai dùng MIL".</text>
</svg>
