<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="320" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Người ta đo sức mạnh degron bằng cách nào (sàng lọc GPS)</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52525b"/></marker></defs>

  <text x="24" y="54" font-size="11" font-weight="700" fill="#18181b">1. Cắt protein thành đoạn ngắn gọi là tile</text>
  <line x1="28" y1="74" x2="300" y2="74" stroke="#a1a1aa" stroke-width="2"/>
  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="28" y="66" width="80" height="16" rx="2"/><rect x="118" y="66" width="80" height="16" rx="2"/><rect x="208" y="66" width="80" height="16" rx="2"/>
  </g>
  <text x="68" y="78" font-size="9" fill="#1e3a8a" text-anchor="middle">tile 1</text>
  <text x="158" y="78" font-size="9" fill="#1e3a8a" text-anchor="middle">tile 2</text>
  <text x="248" y="78" font-size="9" fill="#1e3a8a" text-anchor="middle">tile 3</text>
  <text x="28" y="98" font-size="10" fill="#52525b">mỗi tile dài 30 acid amin</text>

  <text x="376" y="54" font-size="11" font-weight="700" fill="#18181b">2. Gắn tile vào protein phát sáng GFP</text>
  <rect x="380" y="62" width="110" height="24" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="435" y="78" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">GFP (xanh)</text>
  <rect x="492" y="62" width="60" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="522" y="78" font-size="10" fill="#1e3a8a" text-anchor="middle">tile</text>
  <text x="380" y="104" font-size="10" fill="#52525b">Nếu tile là degron mạnh → cả khối bị phá → <tspan font-weight="700" fill="#991b1b">ít sáng</tspan></text>
  <text x="380" y="118" font-size="10" fill="#52525b">Nếu tile không phải degron → khối bền → <tspan font-weight="700" fill="#166534">sáng nhiều</tspan></text>

  <path d="M360 190 L360 150" stroke="#52525b" stroke-width="2" marker-end="url(#a2)" transform="rotate(180 360 170)"/>

  <text x="24" y="156" font-size="11" font-weight="700" fill="#18181b">3. Máy FACS chia tế bào thành 4 nhóm theo độ sáng, rồi đọc trình tự</text>

  <g>
    <rect x="28" y="168" width="150" height="50" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="103" y="188" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">rất sáng</text>
    <text x="103" y="206" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">PSI ≈ 1</text>
    <rect x="188" y="168" width="150" height="50" rx="4" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="263" y="188" font-size="10" font-weight="700" fill="#854d0e" text-anchor="middle">sáng vừa</text>
    <text x="263" y="206" font-size="16" font-weight="700" fill="#854d0e" text-anchor="middle">PSI ≈ 3</text>
    <rect x="348" y="168" width="150" height="50" rx="4" fill="#fed7aa" stroke="#ea580c"/>
    <text x="423" y="188" font-size="10" font-weight="700" fill="#9a3412" text-anchor="middle">tối vừa</text>
    <text x="423" y="206" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">PSI ≈ 4,5</text>
    <rect x="508" y="168" width="150" height="50" rx="4" fill="#fecaca" stroke="#dc2626"/>
    <text x="583" y="188" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">rất tối</text>
    <text x="583" y="206" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">PSI ≈ 6</text>
  </g>
  <text x="28" y="236" font-size="10" fill="#52525b">tile bền, degron yếu</text>
  <text x="658" y="236" font-size="10" fill="#52525b" text-anchor="end">tile bị phá nhanh, degron mạnh</text>

  <rect x="24" y="250" width="672" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="38" y="270" font-size="12" font-weight="700" fill="#1e3a8a">PSI là con số đo được, không phải dự đoán của mô hình</text>
  <text x="38" y="288" font-size="11.5" fill="#1e40af">PSI (Protein Stability Index) chạy từ 1 đến 6. <tspan font-weight="700">PSI cao = protein bị phá nhanh = degron mạnh.</tspan></text>
  <text x="38" y="302" font-size="11.5" fill="#1e40af">Đây là <tspan font-weight="700">nhãn thực nghiệm</tspan> — thứ làm đề tài này đạt cổng G1 mạnh nhất trong repo.</text>
</svg>
