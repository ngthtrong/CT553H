  <text x="204" y="110" font-size="17" font-weight="700" fill="#1d4ed8">256.711</text>
  <text x="204" y="124" font-size="9.5" fill="#3b82f6">phép đo PSI</text>
  <text x="204" y="148" font-size="10" fill="#1e40af">1 điểm cho TỪNG vị trí</text>
  <g>
    <rect x="204" y="156" width="10" height="12" fill="#93c5fd" stroke="#2563eb"/><rect x="216" y="156" width="10" height="12" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="228" y="156" width="10" height="12" fill="#dc2626" stroke="#991b1b"/><rect x="240" y="156" width="10" height="12" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="252" y="156" width="10" height="12" fill="#dc2626" stroke="#991b1b"/><rect x="264" y="156" width="10" height="12" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="276" y="156" width="10" height="12" fill="#93c5fd" stroke="#2563eb"/><rect x="288" y="156" width="10" height="12" fill="#dc2626" stroke="#991b1b"/>
    <rect x="300" y="156" width="10" height="12" fill="#93c5fd" stroke="#2563eb"/><rect x="312" y="156" width="10" height="12" fill="#93c5fd" stroke="#2563eb"/>
