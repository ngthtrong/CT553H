  <g stroke="#15803d" fill="#bbf7d0">
    <rect x="372" y="156" width="9" height="8"/><rect x="383" y="156" width="9" height="8"/><rect x="394" y="156" width="9" height="8"/><rect x="405" y="156" width="9" height="8"/>
    <rect x="372" y="166" width="9" height="8"/><rect x="383" y="166" width="9" height="8"/><rect x="394" y="166" width="9" height="8"/><rect x="405" y="166" width="9" height="8"/>
  </g>
  <text x="372" y="188" font-size="10" font-weight="700" fill="#166534">249 peptide</text>
  <text x="372" y="204" font-size="9.5" fill="#15803d">kiểm độ phân giải cao</text>
  <text x="372" y="218" font-size="9" fill="#b45309">⚠ chỉ 219 footprint</text>
  <text x="372" y="228" font-size="9" fill="#b45309">được tác giả curate</text>

  <!-- 4 -->
  <rect x="528" y="46" width="168" height="186" rx="6" fill="#fafaf9" stroke="#a8a29e"/>
  <rect x="528" y="46" width="168" height="26" rx="6" fill="#f5f5f4" stroke="#a8a29e"/>
