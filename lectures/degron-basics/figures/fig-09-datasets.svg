  <text x="36" y="90" font-size="10" fill="#475569">Voutsinos 2026</text>
  <text x="36" y="110" font-size="17" font-weight="700" fill="#1e293b">212.658</text>
  <text x="36" y="124" font-size="9.5" fill="#64748b">đoạn có điểm</text>
  <text x="36" y="148" font-size="10" fill="#475569">1 điểm cho CẢ đoạn</text>
  <rect x="36" y="156" width="130" height="12" fill="#cbd5e1" stroke="#94a3b8"/>
  <text x="101" y="165" font-size="8" fill="#334155" text-anchor="middle">một điểm duy nhất</text>
  <text x="36" y="188" font-size="10" font-weight="700" fill="#b45309">nhãn YẾU</text>
  <text x="36" y="204" font-size="9.5" fill="#64748b">dùng làm nhiệm vụ</text>
