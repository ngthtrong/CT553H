  <text x="540" y="172" font-size="10" fill="#57534e">chỉ <tspan font-weight="700">9 gene</tspan></text>
  <text x="540" y="192" font-size="10" font-weight="700" fill="#57534e">kiểm tra ngoài</text>
  <text x="540" y="206" font-size="9.5" fill="#78716c">peptide tách rời ≠</text>
  <text x="540" y="218" font-size="9.5" fill="#78716c">protein nguyên vẹn</text>
  <text x="540" y="229" font-size="9" fill="#a8a29e">CC0</text>

  <rect x="24" y="244" width="672" height="46" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="38" y="263" font-size="11.5" fill="#78350f">Mọi con số trên là <tspan font-weight="700">tự đếm từ dữ liệu thô</tspan>, không dẫn lại từ bài báo. Bộ 2 và 3 đã tải về máy, đã kiểm SHA-256.</text>
  <text x="38" y="280" font-size="11.5" fill="#78350f">Dữ liệu nằm ở <tspan font-family="monospace">topics/degron-footprint/data/</tspan> và <tspan font-weight="700">không bao giờ đưa lên git</tspan>.</text>
</svg>
