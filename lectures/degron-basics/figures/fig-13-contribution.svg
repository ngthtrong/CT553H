<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Đóng góp đối chiếu năm tiêu chí GVHD và ba cổng bắt buộc</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <!-- 5 criteria -->
  <text x="24" y="52" font-size="11.5" font-weight="700" fill="#18181b">Năm tiêu chí</text>
  <g font-size="10">
    <rect x="24" y="60" width="330" height="26" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="34" y="77" fill="#3f3f46">① Tính mới</text>
    <rect x="236" y="60" width="118" height="26" fill="#fde68a" stroke="#d97706"/>
    <text x="295" y="77" font-weight="700" fill="#78350f" text-anchor="middle">trung bình–cao</text>

    <rect x="24" y="90" width="330" height="26" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="34" y="107" fill="#3f3f46">② Cải tiến phương pháp</text>
    <rect x="236" y="90" width="118" height="26" fill="#bbf7d0" stroke="#15803d"/>
    <text x="295" y="107" font-weight="700" fill="#166534" text-anchor="middle">có</text>

    <rect x="24" y="120" width="330" height="26" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="34" y="137" fill="#3f3f46">③ Phương pháp mới</text>
    <rect x="236" y="120" width="118" height="26" fill="#bbf7d0" stroke="#15803d"/>
    <text x="295" y="137" font-weight="700" fill="#166534" text-anchor="middle">có — PLM mức residue</text>

    <rect x="24" y="150" width="330" height="26" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="34" y="167" fill="#3f3f46">④ XAI</text>
    <rect x="236" y="150" width="118" height="26" fill="#86efac" stroke="#15803d" stroke-width="2"/>
    <text x="295" y="167" font-weight="700" fill="#14532d" text-anchor="middle">MẠNH NHẤT</text>

    <rect x="24" y="180" width="330" height="26" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="34" y="197" fill="#3f3f46">⑤ Ứng dụng / website</text>
    <rect x="236" y="180" width="118" height="26" fill="#fecaca" stroke="#dc2626"/>
    <text x="295" y="197" font-weight="700" fill="#991b1b" text-anchor="middle">yếu nhất</text>
  </g>

  <rect x="24" y="214" width="330" height="48" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="34" y="232" font-size="10.5" font-weight="700" fill="#166534">Vì sao ④ mạnh nhất</text>
  <text x="34" y="248" font-size="10" fill="#15803d">Đầu ra của mô hình CHÍNH LÀ lời giải thích.</text>
  <text x="34" y="259" font-size="10" fill="#15803d">Không cần gắn thêm SHAP hay IG.</text>

  <!-- 3 gates -->
  <text x="376" y="52" font-size="11.5" font-weight="700" fill="#18181b">Ba cổng bắt buộc</text>
  <rect x="376" y="60" width="320" height="56" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="388" y="79" font-size="11" font-weight="700" fill="#166534">G1 — nhãn độc lập</text>
  <text x="388" y="96" font-size="12" font-weight="700" fill="#14532d">ĐẠT, mạnh nhất repo</text>
  <text x="388" y="110" font-size="9.5" fill="#15803d">toàn bộ là nhãn thực nghiệm, không nhãn nào do pipeline sinh ra</text>

  <rect x="376" y="122" width="320" height="56" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="388" y="141" font-size="11" font-weight="700" fill="#92400e">G2 — đóng góp dương</text>
  <text x="388" y="158" font-size="12" font-weight="700" fill="#78350f">CHƯA XÁC LẬP</text>
  <text x="388" y="172" font-size="9.5" fill="#b45309">khoảng trống đã chứng minh ≠ đóng góp đã đo được</text>

  <rect x="376" y="184" width="320" height="56" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="388" y="203" font-size="11" font-weight="700" fill="#991b1b">G3 — ứng dụng</text>
  <text x="388" y="220" font-size="12" font-weight="700" fill="#7f1d1d">ĐẠT, nhưng yếu nhất</text>
  <text x="388" y="234" font-size="9.5" fill="#b91c1c">ba sản phẩm đã tồn tại → phải khác biệt được</text>

  <rect x="376" y="246" width="320" height="16" rx="3" fill="#f4f4f5"/>
  <text x="388" y="258" font-size="9.5" fill="#52525b">Trượt một cổng là loại, không bù bằng điểm cao chỗ khác</text>

  <!-- contribution sentence -->
  <rect x="24" y="272" width="672" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="38" y="291" font-size="11" font-weight="700" fill="#1e3a8a">Câu đóng góp, viết một dòng (X là thứ chưa biết — cả đề tài là để tìm ra nó)</text>
  <text x="38" y="309" font-size="10.5" fill="#1e40af">"Mô hình đạt precision@3 = <tspan font-weight="700">X</tspan>, so với <tspan font-weight="700">0,6045</tspan> là trần đã chứng minh của lớp mô hình chỉ dùng thành phần,</text>
  <text x="38" y="322" font-size="10.5" fill="#1e40af">và <tspan font-weight="700">0,7792</tspan> là mức tối đa đạt được trên tập này."</text>
</svg>
