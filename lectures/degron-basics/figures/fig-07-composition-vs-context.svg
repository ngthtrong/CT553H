<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Khoảng trống đã được chứng minh: vì sao "chỉ đếm acid amin" là không đủ</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <text x="24" y="52" font-size="11" fill="#52525b">Lấy MỘT peptide. Trong peptide đó, thay <tspan font-weight="700" font-family="monospace">A → V</tspan> ở hai vị trí khác nhau. Thành phần acid amin sau khi thay là <tspan font-weight="700">y hệt nhau</tspan>.</text>

  <!-- case A -->
  <rect x="24" y="66" width="326" height="124" rx="6" fill="#fafafa" stroke="#a1a1aa"/>
  <text x="38" y="86" font-size="11.5" font-weight="700" fill="#18181b">Đột biến ở vị trí 8</text>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="40" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="50" y="113" fill="#3f3f46">M</text>
    <rect x="62" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="72" y="113" fill="#3f3f46">K</text>
    <rect x="84" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="94" y="113" fill="#3f3f46">T</text>
    <rect x="106" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="116" y="113" fill="#3f3f46">L</text>
    <rect x="128" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="138" y="113" fill="#3f3f46">G</text>
    <rect x="150" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="160" y="113" fill="#3f3f46">W</text>
    <rect x="172" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="182" y="113" fill="#3f3f46">S</text>
    <rect x="194" y="98" width="20" height="22" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="204" y="113" fill="#991b1b">V</text>
    <rect x="216" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="226" y="113" fill="#3f3f46">E</text>
    <rect x="238" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="248" y="113" fill="#3f3f46">A</text>
    <rect x="260" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="270" y="113" fill="#3f3f46">D</text>
    <rect x="282" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="292" y="113" fill="#3f3f46">Q</text>
    <rect x="304" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="314" y="113" fill="#3f3f46">R</text>
  </g>
  <text x="204" y="136" font-size="9" fill="#991b1b" text-anchor="middle">A→V ở đây</text>
  <text x="38" y="160" font-size="11" fill="#18181b">Thí nghiệm đo được:</text>
  <text x="38" y="180" font-size="15" font-weight="700" fill="#dc2626">ΔPSI = 1,8  (quan trọng)</text>

  <!-- case B -->
  <rect x="370" y="66" width="326" height="124" rx="6" fill="#fafafa" stroke="#a1a1aa"/>
  <text x="384" y="86" font-size="11.5" font-weight="700" fill="#18181b">Đột biến ở vị trí 22</text>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="386" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="396" y="113" fill="#3f3f46">M</text>
    <rect x="408" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="418" y="113" fill="#3f3f46">K</text>
    <rect x="430" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="440" y="113" fill="#3f3f46">T</text>
    <rect x="452" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="462" y="113" fill="#3f3f46">L</text>
    <rect x="474" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="484" y="113" fill="#3f3f46">G</text>
    <rect x="496" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="506" y="113" fill="#3f3f46">W</text>
    <rect x="518" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="528" y="113" fill="#3f3f46">S</text>
    <rect x="540" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="550" y="113" fill="#3f3f46">A</text>
    <rect x="562" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="572" y="113" fill="#3f3f46">E</text>
    <rect x="584" y="98" width="20" height="22" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="594" y="113" fill="#991b1b">V</text>
    <rect x="606" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="616" y="113" fill="#3f3f46">D</text>
    <rect x="628" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="638" y="113" fill="#3f3f46">Q</text>
    <rect x="650" y="98" width="20" height="22" fill="#e4e4e7" stroke="#a1a1aa"/><text x="660" y="113" fill="#3f3f46">R</text>
  </g>
  <text x="594" y="136" font-size="9" fill="#991b1b" text-anchor="middle">A→V ở đây</text>
  <text x="384" y="160" font-size="11" fill="#18181b">Thí nghiệm đo được:</text>
  <text x="384" y="180" font-size="15" font-weight="700" fill="#15803d">ΔPSI = 0,1  (không quan trọng)</text>

  <!-- verdict -->
  <rect x="24" y="202" width="672" height="78" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="38" y="224" font-size="12.5" font-weight="700" fill="#991b1b">Mô hình chỉ dùng thành phần acid amin BẮT BUỘC cho hai trường hợp này cùng một điểm số</text>
  <text x="38" y="244" font-size="11.5" fill="#b91c1c">Vì nó chỉ biết "peptide này có bao nhiêu A, bao nhiêu V…", và sau khi thay thì hai bên giống nhau hoàn toàn.</text>
  <text x="38" y="260" font-size="11.5" fill="#b91c1c">Nó <tspan font-weight="700">không biết vị trí nào</tspan> bị thay. Nên nó không thể nói vị trí 8 quan trọng mà vị trí 22 thì không.</text>
  <text x="38" y="274" font-size="11.5" font-weight="700" fill="#991b1b">Đây không phải phỏng đoán — đó là một bất biến toán học, đã được kiểm bằng script.</text>

  <!-- counts -->
  <rect x="24" y="292" width="326" height="94" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="38" y="312" font-size="11.5" font-weight="700" fill="#1e3a8a">Chuyện này xảy ra thường xuyên đến mức nào?</text>
  <text x="38" y="334" font-size="20" font-weight="700" fill="#1d4ed8">89,7%</text>
  <text x="130" y="330" font-size="11" fill="#1e40af">peptide (2.353 / 2.624) có ít nhất</text>
  <text x="130" y="344" font-size="11" fill="#1e40af">một nhóm như vậy</text>
  <text x="38" y="366" font-size="11" fill="#1e40af">78,0% peptide có chênh lệch ΔPSI ≥ 1,0</text>
  <text x="38" y="380" font-size="11" fill="#1e40af">trong cùng một nhóm cặp thay thế</text>

  <rect x="370" y="292" width="326" height="94" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="384" y="312" font-size="11.5" font-weight="700" fill="#166534">Vậy chỗ trống cho đề tài là gì?</text>
  <text x="384" y="334" font-size="11" fill="#15803d">Một mô hình <tspan font-weight="700">biết vị trí và ngữ cảnh</tspan> thì</text>
  <text x="384" y="348" font-size="11" fill="#15803d">không bị ràng buộc đó. Nó CÓ THỂ tách</text>
  <text x="384" y="362" font-size="11" fill="#15803d">hai trường hợp trên.</text>
  <text x="384" y="380" font-size="11" font-weight="700" fill="#166534">Đó chính là đóng góp đề tài nhắm tới.</text>
</svg>
