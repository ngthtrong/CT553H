<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Mục tiêu định lượng: đề tài phải vượt con số nào</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>
  <text x="24" y="50" font-size="11" fill="#52525b">Thước đo: <tspan font-weight="700">precision@3</tspan> — trong 3 vị trí mô hình cho là quan trọng nhất, bao nhiêu phần là footprint thật.</text>

  <!-- scale -->
  <line x1="60" y1="130" x2="660" y2="130" stroke="#52525b" stroke-width="2"/>
  <g font-size="9" fill="#71717a" text-anchor="middle">
    <text x="60" y="150">0</text><text x="210" y="150">0,25</text><text x="360" y="150">0,50</text><text x="510" y="150">0,75</text><text x="660" y="150">1,0</text>
  </g>
  <g stroke="#d4d4d8"><line x1="210" y1="124" x2="210" y2="136"/><line x1="360" y1="124" x2="360" y2="136"/><line x1="510" y1="124" x2="510" y2="136"/></g>

  <!-- random 0.1204 -> x = 60 + 0.1204*600 = 132.2 -->
  <line x1="132" y1="100" x2="132" y2="130" stroke="#71717a" stroke-width="2"/>
  <circle cx="132" cy="130" r="5" fill="#71717a"/>
  <text x="132" y="94" font-size="10" font-weight="700" fill="#3f3f46" text-anchor="middle">0,1204</text>
  <text x="132" y="82" font-size="9.5" fill="#71717a" text-anchor="middle">đoán ngẫu nhiên</text>

  <!-- composition ceiling 0.6045 -> 60+362.7 = 422.7 -->
  <line x1="423" y1="94" x2="423" y2="130" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="423" cy="130" r="6" fill="#d97706"/>
  <text x="423" y="86" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">0,6045</text>
  <text x="423" y="72" font-size="9.5" fill="#b45309" text-anchor="middle">TRẦN của mô hình thành phần</text>

  <!-- oracle 0.7792 -> 60+467.5 = 527.5 -->
  <line x1="528" y1="94" x2="528" y2="130" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="528" cy="130" r="6" fill="#15803d"/>
  <text x="528" y="86" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">0,7792</text>
  <text x="528" y="72" font-size="9.5" fill="#166534" text-anchor="middle">oracle không ràng buộc</text>

  <!-- gap bracket -->
  <path d="M423 166 L423 174 L528 174 L528 166" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="475" y="192" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">dư địa 0,1747</text>
  <text x="475" y="206" font-size="10" fill="#b91c1c" text-anchor="middle">= +28,9% tương đối</text>

  <rect x="24" y="214" width="420" height="36" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="36" y="232" font-size="11" fill="#78350f">Mốc phải vượt: <tspan font-weight="700">0,6045</tspan>. Mốc không thể vượt trên tập này: <tspan font-weight="700">0,7792</tspan></text>
  <text x="36" y="245" font-size="10.5" fill="#78350f">(oracle thấp hơn 1,0 vì nhiều peptide có ít hơn 3 vị trí dương).</text>

  <rect x="456" y="214" width="240" height="36" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="468" y="232" font-size="10.5" fill="#3f3f46">Nguồn: tự đo từ dữ liệu thô,</text>
  <text x="468" y="245" font-size="10.5" fill="#3f3f46">không dẫn lại từ bài báo.</text>
</svg>
