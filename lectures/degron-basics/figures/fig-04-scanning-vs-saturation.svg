<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Hai cách đo ảnh hưởng đột biến: quét và bão hòa</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <!-- scanning -->
  <text x="24" y="54" font-size="12" font-weight="700" fill="#1e3a8a">Quét (scanning) — bộ dữ liệu chính của đề tài</text>
  <text x="24" y="70" font-size="10.5" fill="#52525b">Mỗi vị trí chỉ thử MỘT acid amin thay vào. Mỗi hàng có đúng một ô được đo.</text>
  <g>
    <text x="30" y="92" font-size="9" fill="#71717a">vị trí ↓ / thay vào →</text>
    <g font-size="9" fill="#71717a" text-anchor="middle">
      <text x="150" y="92">A</text><text x="174" y="92">V</text><text x="198" y="92">L</text><text x="222" y="92">D</text><text x="246" y="92">K</text><text x="270" y="92">P</text><text x="294" y="92">…</text>
    </g>
    <g stroke="#d4d4d8" fill="#fafafa">
      <g><rect x="138" y="98" width="24" height="18"/><rect x="162" y="98" width="24" height="18"/><rect x="186" y="98" width="24" height="18"/><rect x="210" y="98" width="24" height="18"/><rect x="234" y="98" width="24" height="18"/><rect x="258" y="98" width="24" height="18"/><rect x="282" y="98" width="24" height="18"/></g>
      <g><rect x="138" y="118" width="24" height="18"/><rect x="162" y="118" width="24" height="18"/><rect x="186" y="118" width="24" height="18"/><rect x="210" y="118" width="24" height="18"/><rect x="234" y="118" width="24" height="18"/><rect x="258" y="118" width="24" height="18"/><rect x="282" y="118" width="24" height="18"/></g>
      <g><rect x="138" y="138" width="24" height="18"/><rect x="162" y="138" width="24" height="18"/><rect x="186" y="138" width="24" height="18"/><rect x="210" y="138" width="24" height="18"/><rect x="234" y="138" width="24" height="18"/><rect x="258" y="138" width="24" height="18"/><rect x="282" y="138" width="24" height="18"/></g>
      <g><rect x="138" y="158" width="24" height="18"/><rect x="162" y="158" width="24" height="18"/><rect x="186" y="158" width="24" height="18"/><rect x="210" y="158" width="24" height="18"/><rect x="234" y="158" width="24" height="18"/><rect x="258" y="158" width="24" height="18"/><rect x="282" y="158" width="24" height="18"/></g>
    </g>
    <g fill="#2563eb"><rect x="210" y="98" width="24" height="18"/><rect x="162" y="118" width="24" height="18"/><rect x="258" y="138" width="24" height="18"/><rect x="138" y="158" width="24" height="18"/></g>
    <g font-size="9" fill="#52525b" text-anchor="end"><text x="132" y="111">1</text><text x="132" y="131">2</text><text x="132" y="151">3</text><text x="132" y="171">4</text></g>
  </g>
  <text x="326" y="112" font-size="10.5" fill="#1e40af">ô xanh = đã đo được ΔPSI</text>
  <text x="326" y="130" font-size="10.5" fill="#71717a">ô trống = không có dữ liệu</text>
  <text x="326" y="152" font-size="11" font-weight="700" fill="#18181b">256.711 phép đo</text>
  <text x="326" y="168" font-size="10.5" fill="#52525b">2.624 peptide có footprint</text>

  <line x1="24" y1="190" x2="696" y2="190" stroke="#e4e4e7"/>

  <!-- saturation -->
  <text x="24" y="212" font-size="12" font-weight="700" fill="#166534">Bão hòa (saturation) — bộ kiểm tra độ phân giải cao</text>
  <text x="24" y="228" font-size="10.5" fill="#52525b">Mỗi vị trí thử CẢ 19 acid amin còn lại. Gần như kín cả bảng.</text>
  <g>
    <g stroke="#d4d4d8" fill="#dcfce7">
      <g><rect x="138" y="246" width="24" height="18"/><rect x="162" y="246" width="24" height="18"/><rect x="186" y="246" width="24" height="18"/><rect x="210" y="246" width="24" height="18"/><rect x="234" y="246" width="24" height="18"/><rect x="258" y="246" width="24" height="18"/><rect x="282" y="246" width="24" height="18"/></g>
      <g><rect x="138" y="266" width="24" height="18"/><rect x="162" y="266" width="24" height="18"/><rect x="186" y="266" width="24" height="18"/><rect x="210" y="266" width="24" height="18"/><rect x="234" y="266" width="24" height="18"/><rect x="258" y="266" width="24" height="18"/><rect x="282" y="266" width="24" height="18"/></g>
      <g><rect x="138" y="286" width="24" height="18"/><rect x="162" y="286" width="24" height="18"/><rect x="186" y="286" width="24" height="18"/><rect x="210" y="286" width="24" height="18"/><rect x="234" y="286" width="24" height="18"/><rect x="258" y="286" width="24" height="18"/><rect x="282" y="286" width="24" height="18"/></g>
    </g>
    <g fill="#f4f4f5" stroke="#d4d4d8"><rect x="186" y="246" width="24" height="18"/><rect x="234" y="266" width="24" height="18"/><rect x="138" y="286" width="24" height="18"/></g>
    <g font-size="9" fill="#52525b" text-anchor="end"><text x="132" y="259">1</text><text x="132" y="279">2</text><text x="132" y="299">3</text></g>
  </g>
  <text x="326" y="260" font-size="10.5" fill="#166534">ô xanh lá = đã đo</text>
  <text x="326" y="276" font-size="10.5" fill="#71717a">ô xám = ô WT→WT, không có nghĩa</text>
  <text x="326" y="296" font-size="11" font-weight="700" fill="#18181b">135.040 định danh trên 249 peptide</text>
  <text x="326" y="312" font-size="10" fill="#b45309">⚠ chưa phải 135.040 ΔPSI đã đạt chất lượng</text>
  <text x="326" y="328" font-size="10" fill="#b45309">chỉ 219 footprint được tác giả curate</text>
</svg>
