<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="210" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Protein là một chuỗi acid amin</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <line x1="60" y1="95" x2="660" y2="95" stroke="#52525b" stroke-width="2"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="80"  cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="80"  y="100" fill="#1e3a8a">M</text>
    <circle cx="140" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="140" y="100" fill="#1e3a8a">K</text>
    <circle cx="200" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="200" y="100" fill="#1e3a8a">T</text>
    <circle cx="260" cy="95" r="19" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="260" y="100" fill="#78350f">A</text>
    <circle cx="320" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="320" y="100" fill="#1e3a8a">L</text>
    <circle cx="380" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="380" y="100" fill="#1e3a8a">G</text>
    <circle cx="440" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="440" y="100" fill="#1e3a8a">W</text>
    <circle cx="500" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="500" y="100" fill="#1e3a8a">S</text>
    <circle cx="560" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="560" y="100" fill="#1e3a8a">E</text>
    <circle cx="620" cy="95" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="620" y="100" fill="#1e3a8a">D</text>
  </g>
  <text x="80" y="62" font-size="10" fill="#52525b" text-anchor="middle">đầu N</text>
  <text x="620" y="62" font-size="10" fill="#52525b" text-anchor="middle">đầu C</text>
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <text x="80" y="128">1</text><text x="140" y="128">2</text><text x="200" y="128">3</text>
    <text x="260" y="128">4</text><text x="320" y="128">5</text><text x="380" y="128">6</text>
    <text x="440" y="128">7</text><text x="500" y="128">8</text><text x="560" y="128">9</text><text x="620" y="128">10</text>
  </g>
  <text x="360" y="148" font-size="11" fill="#52525b" text-anchor="middle">vị trí (position)</text>

  <rect x="16" y="162" width="688" height="38" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="28" y="180" font-size="11.5" fill="#78350f">Mỗi hạt là <tspan font-weight="700">một acid amin</tspan>, viết bằng một chữ cái. Có 20 loại. Chuỗi này dài 10 vị trí.</text>
  <text x="28" y="194" font-size="11.5" fill="#78350f">Ký hiệu <tspan font-weight="700">A4V</tspan> nghĩa là: acid amin A ở vị trí 4 bị thay bằng V. Đó là một <tspan font-weight="700">đột biến thay thế</tspan>.</text>
</svg>
