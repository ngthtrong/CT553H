<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Đánh giá: precision@3 nghĩa là gì</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <text x="24" y="52" font-size="11" fill="#52525b">Mô hình xếp hạng 28 vị trí. Ta chỉ xét 3 vị trí nó tin nhất, rồi đối chiếu với kết quả thí nghiệm.</text>

  <!-- model ranking -->
  <text x="24" y="80" font-size="11" font-weight="700" fill="#18181b">Mô hình nói: 3 vị trí quan trọng nhất là</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="300" y="64" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="321" y="82" fill="#1e3a8a">11</text>
    <rect x="350" y="64" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="371" y="82" fill="#1e3a8a">8</text>
    <rect x="400" y="64" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="421" y="82" fill="#1e3a8a">25</text>
  </g>

  <text x="24" y="116" font-size="11" font-weight="700" fill="#18181b">Thí nghiệm nói: footprint thật là</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="300" y="100" width="42" height="26" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="321" y="118" fill="#166534">8</text>
    <rect x="350" y="100" width="42" height="26" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="371" y="118" fill="#166534">11</text>
    <rect x="400" y="100" width="42" height="26" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="421" y="118" fill="#166534">17</text>
  </g>

  <!-- result -->
  <rect x="24" y="140" width="672" height="56" rx="6" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="38" y="160" font-size="11" fill="#18441b">Trùng: <tspan font-weight="700" fill="#15803d">11 ✓</tspan> và <tspan font-weight="700" fill="#15803d">8 ✓</tspan> — nhưng <tspan font-weight="700" fill="#dc2626">25 ✗</tspan> (vị trí 25 không phải footprint; mô hình bỏ sót 17)</text>
  <text x="38" y="184" font-size="13" font-weight="700" fill="#18181b">precision@3 = 2 / 3 = <tspan fill="#2563eb">0,667</tspan>   →  cao hơn trần 0,6045 của mô hình thành phần</text>

  <!-- three tiers -->
  <text x="24" y="224" font-size="11.5" font-weight="700" fill="#18181b">Ba bậc đánh giá, khó dần</text>
  <rect x="24" y="234" width="216" height="80" rx="6" fill="#fafafa" stroke="#a1a1aa"/>
  <text x="36" y="252" font-size="10.5" font-weight="700" fill="#3f3f46">Bậc 1 — tái lập baseline</text>
  <text x="36" y="268" font-size="10" fill="#52525b">Chạy lại PAP trên điểm đoạn.</text>
  <text x="36" y="282" font-size="10" fill="#52525b">Đã đạt Pearson 0,8690.</text>
  <text x="36" y="300" font-size="10" font-weight="700" fill="#b45309">Chỉ để chứng minh chạy được —</text>
  <text x="36" y="311" font-size="10" font-weight="700" fill="#b45309">KHÔNG phải đóng góp.</text>

  <rect x="252" y="234" width="216" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="264" y="252" font-size="10.5" font-weight="700" fill="#1e3a8a">Bậc 2 — THƯỚC ĐO CHÍNH</text>
  <text x="264" y="268" font-size="10" fill="#1e40af">Dự đoán bản đồ theo residue</text>
  <text x="264" y="282" font-size="10" fill="#1e40af">trên 2.624 peptide, chia theo</text>
  <text x="264" y="294" font-size="10" fill="#1e40af">cụm protein.</text>
  <text x="264" y="311" font-size="10" font-weight="700" fill="#1d4ed8">Spearman + precision@3</text>

  <rect x="480" y="234" width="216" height="80" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="492" y="252" font-size="10.5" font-weight="700" fill="#166534">Bậc 3 — ma trận đầy đủ</text>
  <text x="492" y="268" font-size="10" fill="#15803d">249 peptide bão hòa,</text>
  <text x="492" y="282" font-size="10" fill="#15803d">vị trí × 19 thay thế.</text>
  <text x="492" y="300" font-size="10" fill="#b45309">Cần xử lý score và chia tập</text>
  <text x="492" y="311" font-size="10" fill="#b45309">cẩn thận trước khi dùng.</text>

  <rect x="24" y="324" width="672" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="38" y="344" font-size="11" fill="#991b1b"><tspan font-weight="700">Rủi ro số một:</tspan> chia theo cụm protein thì tập test chỉ còn <tspan font-weight="700">221–322 footprint</tspan>. Phải tính lực thống kê TRƯỚC khi huấn luyện.</text>
</svg>
