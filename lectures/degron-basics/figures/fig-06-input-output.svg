<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Đầu vào và đầu ra của mô hình</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>
  <defs><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker></defs>

  <!-- input -->
  <rect x="24" y="48" width="200" height="200" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="124" y="70" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">ĐẦU VÀO</text>
  <text x="38" y="96" font-size="11" font-weight="700" fill="#18181b">Bắt buộc</text>
  <text x="38" y="114" font-size="10.5" fill="#1e40af">• Trình tự peptide 28–30</text>
  <text x="48" y="128" font-size="10.5" fill="#1e40af">acid amin</text>
  <text x="38" y="146" font-size="10" fill="#52525b" font-family="monospace">MKTALGWSEDQ…</text>
  <text x="38" y="174" font-size="11" font-weight="700" fill="#18181b">Tuỳ chọn</text>
  <text x="38" y="192" font-size="10.5" fill="#1e40af">• rASA: residue này có</text>
  <text x="48" y="206" font-size="10.5" fill="#1e40af">lộ ra ngoài không</text>
  <text x="38" y="224" font-size="10.5" fill="#1e40af">• pLDDT: AlphaFold tin</text>
  <text x="48" y="238" font-size="10.5" fill="#1e40af">cấu trúc này đến đâu</text>

  <path d="M234 148 L286 148" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- model -->
  <rect x="294" y="98" width="130" height="100" rx="6" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
  <text x="359" y="134" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">MÔ HÌNH</text>
  <text x="359" y="154" font-size="10" fill="#52525b" text-anchor="middle">học từ nhãn</text>
  <text x="359" y="168" font-size="10" fill="#52525b" text-anchor="middle">thực nghiệm</text>

  <path d="M434 148 L486 148" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- output -->
  <rect x="494" y="48" width="202" height="200" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="595" y="70" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">ĐẦU RA</text>
  <text x="508" y="94" font-size="11" font-weight="700" fill="#18181b">1. Bản đồ theo residue</text>
  <g>
    <rect x="508" y="102" width="12" height="10" fill="#bbf7d0"/><rect x="522" y="100" width="12" height="12" fill="#bbf7d0"/>
    <rect x="536" y="96" width="12" height="16" fill="#dc2626"/><rect x="550" y="104" width="12" height="8" fill="#bbf7d0"/>
    <rect x="564" y="94" width="12" height="18" fill="#dc2626"/><rect x="578" y="103" width="12" height="9" fill="#bbf7d0"/>
    <rect x="592" y="105" width="12" height="7" fill="#bbf7d0"/><rect x="606" y="98" width="12" height="14" fill="#dc2626"/>
    <rect x="620" y="104" width="12" height="8" fill="#bbf7d0"/><rect x="634" y="102" width="12" height="10" fill="#bbf7d0"/>
  </g>
  <text x="508" y="126" font-size="10" fill="#52525b">vị trí nào quan trọng</text>
  <text x="508" y="150" font-size="11" font-weight="700" fill="#18181b">2. Ma trận 28 × 20</text>
  <g stroke="#86efac" fill="#dcfce7">
    <rect x="508" y="158" width="11" height="9"/><rect x="520" y="158" width="11" height="9"/><rect x="532" y="158" width="11" height="9"/><rect x="544" y="158" width="11" height="9"/><rect x="556" y="158" width="11" height="9"/>
    <rect x="508" y="168" width="11" height="9"/><rect x="520" y="168" width="11" height="9" fill="#fca5a5"/><rect x="532" y="168" width="11" height="9"/><rect x="544" y="168" width="11" height="9"/><rect x="556" y="168" width="11" height="9"/>
    <rect x="508" y="178" width="11" height="9"/><rect x="520" y="178" width="11" height="9"/><rect x="532" y="178" width="11" height="9" fill="#fca5a5"/><rect x="544" y="178" width="11" height="9"/><rect x="556" y="178" width="11" height="9"/>
  </g>
  <text x="572" y="176" font-size="9.5" fill="#52525b">mỗi vị trí ×</text>
  <text x="572" y="188" font-size="9.5" fill="#52525b">mỗi thay thế</text>
  <text x="508" y="208" font-size="11" font-weight="700" fill="#18181b">3. Top-3 vị trí đáng thử</text>
  <text x="508" y="226" font-size="10.5" fill="#166534">ví dụ: vị trí 8, 11, 17</text>
  <text x="508" y="240" font-size="10" fill="#52525b">để nhà sinh học đem đi làm thí nghiệm</text>

  <rect x="24" y="258" width="672" height="32" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="38" y="278" font-size="11.5" fill="#78350f">Lưu ý: nhãn thực nghiệm (PSI, ΔPSI) <tspan font-weight="700">chỉ dùng để huấn luyện và đánh giá</tspan>, không phải đầu vào khi dùng thật.</text>
</svg>
