<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="16" y="26" font-size="14" font-weight="700" fill="#18181b">Footprint là gì: chỉ vài vị trí trong degron thật sự quan trọng</text>
  <text x="704" y="26" font-size="9" fill="#a1a1aa" text-anchor="end">SƠ ĐỒ TỰ DỰNG</text>

  <text x="24" y="52" font-size="11" fill="#52525b">Trục ngang: 28 vị trí của một peptide. Trục dọc: ΔPSI = PSI(đột biến) − PSI(gốc), tức đột biến làm degron mạnh thêm bao nhiêu.</text>

  <line x1="56" y1="180" x2="684" y2="180" stroke="#52525b" stroke-width="1.5"/>
  <line x1="56" y1="70" x2="56" y2="190" stroke="#52525b" stroke-width="1.5"/>
  <text x="48" y="74" font-size="9" fill="#52525b" text-anchor="end">2,0</text>
  <text x="48" y="128" font-size="9" fill="#52525b" text-anchor="end">1,0</text>
  <text x="48" y="184" font-size="9" fill="#52525b" text-anchor="end">0</text>
  <line x1="56" y1="126" x2="684" y2="126" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="688" y="124" font-size="9" fill="#dc2626">ngưỡng 1,0</text>

  <!-- bars: 28 positions, 3 above threshold -->
  <g>
    <rect x="62" y="166" width="16" height="14" fill="#cbd5e1"/>
    <rect x="84" y="172" width="16" height="8" fill="#cbd5e1"/>
    <rect x="106" y="158" width="16" height="22" fill="#cbd5e1"/>
    <rect x="128" y="174" width="16" height="6" fill="#cbd5e1"/>
    <rect x="150" y="162" width="16" height="18" fill="#cbd5e1"/>
    <rect x="172" y="170" width="16" height="10" fill="#cbd5e1"/>
    <rect x="194" y="150" width="16" height="30" fill="#cbd5e1"/>
    <rect x="216" y="88"  width="16" height="92" fill="#dc2626"/>
    <rect x="238" y="156" width="16" height="24" fill="#cbd5e1"/>
    <rect x="260" y="168" width="16" height="12" fill="#cbd5e1"/>
    <rect x="282" y="104" width="16" height="76" fill="#dc2626"/>
    <rect x="304" y="164" width="16" height="16" fill="#cbd5e1"/>
    <rect x="326" y="172" width="16" height="8" fill="#cbd5e1"/>
    <rect x="348" y="154" width="16" height="26" fill="#cbd5e1"/>
    <rect x="370" y="166" width="16" height="14" fill="#cbd5e1"/>
    <rect x="392" y="146" width="16" height="34" fill="#cbd5e1"/>
    <rect x="414" y="96"  width="16" height="84" fill="#dc2626"/>
    <rect x="436" y="170" width="16" height="10" fill="#cbd5e1"/>
    <rect x="458" y="160" width="16" height="20" fill="#cbd5e1"/>
    <rect x="480" y="174" width="16" height="6" fill="#cbd5e1"/>
    <rect x="502" y="164" width="16" height="16" fill="#cbd5e1"/>
    <rect x="524" y="168" width="16" height="12" fill="#cbd5e1"/>
    <rect x="546" y="152" width="16" height="28" fill="#cbd5e1"/>
    <rect x="568" y="172" width="16" height="8" fill="#cbd5e1"/>
    <rect x="590" y="166" width="16" height="14" fill="#cbd5e1"/>
    <rect x="612" y="158" width="16" height="22" fill="#cbd5e1"/>
    <rect x="634" y="170" width="16" height="10" fill="#cbd5e1"/>
    <rect x="656" y="174" width="16" height="6" fill="#cbd5e1"/>
  </g>
  <g font-size="9" fill="#991b1b" font-weight="700" text-anchor="middle">
    <text x="224" y="82">8</text><text x="290" y="98">11</text><text x="422" y="90">17</text>
  </g>
  <text x="370" y="200" font-size="10" fill="#52525b" text-anchor="middle">vị trí 1 … 28</text>

  <rect x="24" y="212" width="330" height="76" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="38" y="232" font-size="11.5" font-weight="700" fill="#991b1b">Cột đỏ = footprint</text>
  <text x="38" y="250" font-size="11" fill="#b91c1c">Đổi acid amin ở vị trí 8, 11 hoặc 17 làm degron</text>
  <text x="38" y="264" font-size="11" fill="#b91c1c">mạnh lên rõ rệt (ΔPSI ≥ 1,0).</text>
  <text x="38" y="281" font-size="11" fill="#b91c1c">Trung vị toàn bộ dữ liệu: <tspan font-weight="700">3 vị trí trên 28</tspan>.</text>

  <rect x="366" y="212" width="330" height="76" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="232" font-size="11.5" font-weight="700" fill="#1e3a8a">Đây chính là thứ đề tài phải dự đoán</text>
  <text x="380" y="250" font-size="11" fill="#1e40af">Cho một peptide chưa từng thấy, hãy chỉ ra</text>
  <text x="380" y="264" font-size="11" fill="#1e40af">vị trí nào là footprint — mà không được xem</text>
  <text x="380" y="281" font-size="11" fill="#1e40af">kết quả thí nghiệm của chính peptide đó.</text>
</svg>
